      const body = audioCtx.createOscillator(), bodyGain = audioCtx.createGain();
      body.type = 'sine';
      body.frequency.setValueAtTime(2400, t);
      body.frequency.exponentialRampToValueAtTime(1800, t + 0.01);
      bodyGain.gain.setValueAtTime(0.0001, t);
      bodyGain.gain.exponentialRampToValueAtTime(VOL_BODY, t + 0.001);
      bodyGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.014);
      body.connect(bodyGain); bodyGain.connect(audioCtx.destination);
      body.start(t); body.stop(t + 0.02);

      const click = audioCtx.createBufferSource(), cf = audioCtx.createBiquadFilter(), cg = audioCtx.createGain();
      click.buffer = getNoiseBuffer();
      cf.type = 'highpass'; cf.frequency.value = 3500;
      cg.gain.setValueAtTime(0.0001, t);
      cg.gain.exponentialRampToValueAtTime(VOL_CLICK, t + 0.0005);
      cg.gain.exponentialRampToValueAtTime(0.0001, t + 0.006);
      click.connect(cf); cf.connect(cg); cg.connect(audioCtx.destination);
      click.start(t); click.stop(t + 0.01);
    }
    function tick() {
      const now = Date.now();
      if (now - lastTick < MIN_INTERVAL) return;
      lastTick = now;
      triggerHaptic(TICK_DURATION);
      playTick();
    }

    box.addEventListener('scroll', function () {
      const index = Math.round(box.scrollTop / step());
      if (index !== lastIndex) { lastIndex = index; tick(); }
    }, { passive: true });
    box.addEventListener('touchstart', unlockAudio, { passive: true });
    box.addEventListener('pointerdown', unlockAudio, { passive: true });
    document.getElementById('f-destino').addEventListener('click', function () {
      unlockAudio();
      requestAnimationFrame(function () { lastIndex = Math.round(box.scrollTop / step()); });
    });
  })();

  // La pantalla del cliente avisa si la sesión caducó: se cierra y se vuelve al inicio de sesión
  window.addEventListener('message', ev => {
    if (!ev.data || ev.data.suprenv !== 'session-expired') return;
    const host = ['suprenv-admin-host', 'suprenv-client-host', 'suprenv-operator-host'].map(i => document.getElementById(i)).find(x => x && ev.source === x.contentWindow);
    if (!host) return;
    host.style.display = 'none'; host.removeAttribute('srcdoc');
    window.suprenvCurrentRole = null;
    try { supabaseClient && supabaseClient.auth.signOut(); } catch (e) {}
    goScreen('login');
  });

  // ===== PWA: sesión persistente, instalación y avisos (notificaciones push) =====
  (function () {
    'use strict';
    const sb = supabaseClient;
    const VAPID_PUBLIC = 'BC09ns0HN1mTCrQ5qeBhrwYWOYLL7FbhTYmJdkywkNkKA_pPKj9m8aemuYPZ21kyPlJswBv5nF55XJUdwfHWKa0';
    const root = document.documentElement;
    const bootDone = () => root.classList.remove('booting');
    setTimeout(bootDone, 10000);   // por seguridad, la pantalla de arranque nunca se queda pegada
    if (!sb) { bootDone(); return; }

    const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
    const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
    const standalone = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const pushOK = ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window);
    const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);

    // --- Service worker + almacenamiento persistente (para que el navegador no borre la sesión) ---
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      const reg = () => navigator.serviceWorker.register('sw.js').catch((e) => console.warn('Service worker:', e));
      if (document.readyState === 'complete') reg(); else window.addEventListener('load', reg);
    }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

    // --- Sesión persistente: al abrir la app se entra directo mientras la sesión siga activa ---
    let timer = null;
    function retry(n) { clearTimeout(timer); timer = setTimeout(() => resume(n + 1), Math.min(3000 * (n + 1), 15000)); }
    async function resume(n) {
      if (window.suprenvCurrentRole) { bootDone(); return; }
      try {
        const ses = await sb.auth.getSession();
        const session = ses && ses.data && ses.data.session;
        if (!session) { if (ses && ses.error && n < 8) retry(n); bootDone(); return; }   // sin sesión: pantalla de inicio normal
        const r = await sb.rpc('get_my_role');
        if (r.error) {
          const m = String(r.error.message || '');
          if (r.error.code === 'PGRST301' || /jwt|expired|not authenticated|invalid.*token|refresh token/i.test(m)) { try { await sb.auth.signOut(); } catch (e) {} bootDone(); return; }
          throw r.error;   // sin conexión u otro fallo temporal: reintenta sin cerrar la sesión
        }
        const role = parseRole(r.data);
        if (!role || window.suprenvCurrentRole) { bootDone(); return; }
        const target = (role === 'admin' || role === 'owner') ? ['suprenv-admin-host', SUPRENV_ADMIN_HTML]
          : (role === 'client' || role === 'usuario') ? ['suprenv-client-host', SUPRENV_CLIENT_HTML]
          : (role === 'operator' || role === 'gestor' || role === 'manager') ? ['suprenv-operator-host', SUPRENV_OPERATOR_HTML] : null;
        if (!target) { bootDone(); return; }
        const host = document.getElementById(target[0]);
        if (!host) throw new Error('La pantalla aún no está lista');   // reintenta en unos segundos
        window.suprenvCurrentRole = role; window.suprenvCurrentUser = session.user || null;
        host.srcdoc = target[1]; host.style.display = 'block';
        bootDone();
      } catch (e) { bootDone(); if (n < 8) retry(n); }
    }
    window.addEventListener('online', () => { if (!window.suprenvCurrentRole) resume(0); });
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => resume(0)); else resume(0);

    // --- Aviso flotante (instalar app / activar avisos) ---
    const css = document.createElement('style');
    css.textContent = '#pwa-bar{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 10px);width:min(92vw,420px);box-sizing:border-box;z-index:2147483000;display:flex;gap:8px;align-items:center;padding:12px 8px 12px 14px;border-radius:16px;background:rgba(18,24,46,.97);color:#fff;font-size:14px;line-height:1.35;border:1px solid rgba(150,180,255,.28);box-shadow:0 10px 30px rgba(0,0,0,.5)}#pwa-bar p{margin:0;flex:1;min-width:0;overflow-wrap:anywhere}#pwa-bar button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 14px;color:#fff;background:#3566d6;white-space:nowrap;cursor:pointer}#pwa-bar button.x{background:transparent;color:rgba(255,255,255,.65);padding:10px 10px;font-size:18px;line-height:1}';
    document.head.appendChild(css);
    let bar = null, hideTimer = null;
    function closeBar() { clearTimeout(hideTimer); if (bar) { bar.remove(); bar = null; } }
    const dismissed = (key, days) => { const t = Number(lsGet('suprenv_pwa_' + key) || 0); return !!t && (Date.now() - t) < days * 864e5; };
    function showBar(text, label, onGo, dismissKey, autoHide) {
      closeBar();
      bar = document.createElement('div'); bar.id = 'pwa-bar'; bar.setAttribute('role', 'status');
      const p = document.createElement('p'); p.textContent = text; bar.appendChild(p);
      if (label) { const go = document.createElement('button'); go.type = 'button'; go.textContent = label; go.addEventListener('click', () => onGo()); bar.appendChild(go); }
      const x = document.createElement('button'); x.type = 'button'; x.className = 'x'; x.textContent = '×'; x.setAttribute('aria-label', 'Cerrar');
      x.addEventListener('click', () => { if (dismissKey) lsSet('suprenv_pwa_' + dismissKey, String(Date.now())); closeBar(); });
      bar.appendChild(x); document.body.appendChild(bar);
      if (autoHide) hideTimer = setTimeout(closeBar, autoHide);
    }

    // --- Instalar como app ---
    let deferred = null, sessionActive = false;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); deferred = e;
      if (!bar && !standalone() && !dismissed('install', 14)) {
        showBar('Instala SUPRENV en tu teléfono para abrirla como una app.', 'Instalar', async () => {
          const d = deferred; deferred = null; closeBar();
          try { d.prompt(); await d.userChoice; } catch (err) {}
        }, 'install');
      }
    });
    window.addEventListener('appinstalled', () => { deferred = null; closeBar(); });

    // --- Avisos push (funcionan con la app cerrada) ---
    const b64ToU8 = (s) => { const pad = '='.repeat((4 - s.length % 4) % 4); const r = atob((s + pad).replace(/-/g, '+').replace(/_/g, '/')); const o = new Uint8Array(r.length); for (let i = 0; i < r.length; i++) o[i] = r.charCodeAt(i); return o; };
    const u8ToB64 = (buf) => btoa(String.fromCharCode.apply(null, new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    async function pushSubscribe() {
      const reg = await withTimeout(navigator.serviceWorker.ready, 10000);
      let sub = await reg.pushManager.getSubscription();
      if (sub) {   // si cambió la clave del servidor, se vuelve a suscribir
        const k = sub.options && sub.options.applicationServerKey;
        if (k && u8ToB64(k) !== VAPID_PUBLIC) { try { await sub.unsubscribe(); } catch (e) {} sub = null; }
      }
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(VAPID_PUBLIC) });
      const j = sub.toJSON();
      const r = await sb.rpc('save_push_subscription', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_user_agent: navigator.userAgent });
      if (r.error) throw r.error;
    }
    async function pushRemove() {
      const reg = await navigator.serviceWorker.getRegistration(); if (!reg) return;
      const sub = await reg.pushManager.getSubscription(); if (!sub) return;
      try { await sb.rpc('remove_push_subscription', { p_endpoint: sub.endpoint }); } catch (e) {}
      try { await sub.unsubscribe(); } catch (e) {}
    }
    function enablePush() {
      Promise.resolve(Notification.requestPermission()).then(async (perm) => {
        if (perm === 'granted') {
          try { await pushSubscribe(); showBar('Avisos activados. Te notificaremos aunque la app esté cerrada.', null, null, null, 3500); }
          catch (e) { console.warn('Push:', e); showBar('No se pudieron activar los avisos. Inténtalo de nuevo más tarde.', null, null, null, 4500); }
        } else if (perm === 'denied') {
          showBar('Los avisos quedaron bloqueados. Puedes activarlos desde los ajustes del navegador.', null, null, 'notif', 6000);
        } else { closeBar(); }
      });
    }
    let synced = false;
    function afterSession() {
      sessionActive = true;
      if (!pushOK) {
        if (isIOS && !standalone() && !dismissed('ios', 7)) {
          showBar('Para recibir avisos en iPhone, instala la app: toca Compartir y luego “Agregar a inicio”.', 'Entendido', () => { lsSet('suprenv_pwa_ios', String(Date.now())); closeBar(); }, 'ios');
        }
        return;
      }
      if (Notification.permission === 'granted') {
        if (!synced) { synced = true; pushSubscribe().catch((e) => { synced = false; console.warn('Push:', e); }); }
        return;
      }
      if (Notification.permission === 'default' && !dismissed('notif', 7)) {
        showBar('Activa los avisos y te notificamos aunque la app esté cerrada.', 'Activar avisos', enablePush, 'notif');
      }
    }
    sb.auth.onAuthStateChange((ev, s) => {
      if (ev === 'SIGNED_OUT') { sessionActive = false; synced = false; closeBar(); return; }
      if (s && (ev === 'SIGNED_IN' || ev === 'INITIAL_SESSION')) setTimeout(afterSession, 1500);
    });
    // Al cerrar sesión se quita este dispositivo de los avisos (otra persona no recibe los tuyos).
    const origSignOut = sb.auth.signOut.bind(sb.auth);
    sb.auth.signOut = async function () {
      try { if (pushOK) await withTimeout(pushRemove(), 3000); } catch (e) {}
      return origSignOut.apply(null, arguments);
    };
  })();
</script>
