o-main glass-logo\"><i class=\"gl-under\"><\/i><i class=\"gl-under2\"><\/i><i class=\"gl-rim\"><\/i><div class=\"spin\"><i class=\"gl-edge\"><\/i><i class=\"gl-face\"><\/i><i class=\"carve hi\"><\/i><i class=\"carve sh\"><\/i><i class=\"carve in\"><\/i><\/div><\/div><\/div>\n\n  <div class=\"title\">Solicita tu mensajería<\/div>\n\n  <section class=\"card\" aria-label=\"Solicitud de mensajería\">\n    <div class=\"grid\" id=\"view-1\">\n\n      <div class=\"fields\">\n        <button id=\"f-destino\" class=\"fieldbtn empty\" type=\"button\" aria-expanded=\"false\" aria-controls=\"panel\">Destino<\/button>\n        <button id=\"f-monto\" class=\"fieldbtn empty\" type=\"button\" aria-expanded=\"false\" aria-controls=\"panel\">Monto<\/button>\n      <\/div>\n\n      <div id=\"panel\" class=\"panel\" data-view=\"prov\">\n\n        <div data-for=\"idle\"><p class=\"hint\">Toca Destino o Monto para elegir<\/p><\/div>\n\n        <div data-for=\"prov\" role=\"group\" aria-label=\"Provincias\">\n          <button id=\"prov-up\" class=\"mnav v\" type=\"button\" aria-label=\"Subir en la lista\"><svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 15l7-7 7 7\"/><\/svg><\/button>\n          <div id=\"prov-list\" class=\"prov-list\">\n          <button class=\"city\" type=\"button\" aria-pressed=\"false\">Santiago<\/button>\n          <button class=\"city\" type=\"button\" aria-pressed=\"false\">Holguín<\/button>\n          <button class=\"city\" type=\"button\" aria-pressed=\"false\">La Habana<\/button>\n          <button class=\"city\" type=\"button\" aria-pressed=\"false\">Las Tunas<\/button>\n          <button class=\"city\" type=\"button\" aria-pressed=\"false\">Pinar del Río<\/button>\n          <button class=\"city\" type=\"button\" aria-pressed=\"false\">Artemisa<\/button>\n          <button class=\"city\" type=\"button\" aria-pressed=\"false\">Mayabeque<\/button>\n          <button class=\"city\" type=\"button\" aria-pressed=\"false\">Matanzas<\/button>\n          <button class=\"city\" type=\"button\" aria-pressed=\"false\">Cienfuegos<\/button>\n          <button class=\"city\" type=\"button\" aria-pressed=\"false\">Villa Clara<\/button>\n          <button class=\"city\" type=\"button\" aria-pressed=\"false\">Sancti Spíritus<\/button>\n          <button class=\"city\" type=\"button\" aria-pressed=\"false\">Ciego de Ávila<\/button>\n          <button class=\"city\" type=\"button\" aria-pressed=\"false\">Camagüey<\/button>\n          <button class=\"city\" type=\"button\" aria-pressed=\"false\">Granma<\/button>\n          <button class=\"city\" type=\"button\" aria-pressed=\"false\">Guantánamo<\/button>\n          <button class=\"city long\" type=\"button\" aria-pressed=\"false\">Isla de la Juventud<\/button>\n          <\/div>\n          <button id=\"prov-down\" class=\"mnav v\" type=\"button\" aria-label=\"Bajar en la lista\"><svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 9l7 7 7-7\"/><\/svg><\/button>\n        <\/div>\n\n        <div data-for=\"addr\">\n          <button id=\"addr-prov\" class=\"city\" type=\"button\" aria-pressed=\"true\" title=\"Cambiar provincia\"><\/button>\n          <div class=\"muni-row\" role=\"group\" aria-label=\"Municipios\">\n            <button id=\"muni-prev\" class=\"mnav\" type=\"button\" aria-label=\"Municipio anterior\"><svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 5l-7 7 7 7\"/><\/svg><\/button>\n            <div id=\"muni-strip\" class=\"muni-strip\"><\/div>\n            <button id=\"muni-next\" class=\"mnav\" type=\"button\" aria-label=\"Municipio siguiente\ orAll('[data-for=\"prov\"] .city'));\n  const state = { prov: null, muni: null, usd: 0, usdt: 0, cur: 'USD' };   // se entrega en USD\n\n  // ===== Conexión con Supabase (usa la misma sesión de la ventana principal) =====\n  const sb = (() => { try { return (window.parent && window.parent !== window && window.parent.supabaseClient) || window.supabaseClient || null; } catch (e) { return null; } })();\n  const ids = { prov: {}, muni: {} };                 // nombre → id (se cargan de la base de datos)\n  const me = { uid: null, profile: {}, requireId: true };\n  let current = null;                                 // remesa en curso (fila de public.remittances)\n  const FINAL = ['settled', 'cancelled'];\n  const norm = s => String(s || '').normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').toLowerCase().trim();\n  const fmtUsdt = v => { const s = Number(v).toFixed(6).replace(/0+$/, ''); return (s.split('.')[1] || '').length >= 2 ? s : Number(v).toFixed(2); };\n  const ERR = {\n    not_authenticated: 'Tu sesión caducó. Vuelve a iniciar sesión.',\n    only_clients_can_create: 'Solo las cuentas de cliente pueden crear solicitudes.',\n    invalid_amount: 'Escribe un monto válido.',\n    missing_beneficiary_data: 'Faltan datos de entrega: nombre, teléfono o dirección.',\n    invalid_municipality: 'Elige un municipio válido.',\n    beneficiary_not_found: 'No se encontró el destinatario.',\n    wallet_not_configured: 'Los pagos aún no están disponibles. Inténtalo más tarde.',\n    no_operator_available: 'No hay gestor disponible en ese lugar.',\n    invalid_hash: 'El hash no es válido: debe empezar con 0x y tener 64 caracteres.',\n    hash_already_used: 'Ese hash ya fue registrado.',\n    remittance_not_found_or_invalid_state: 'Esta solicitud ya no admite ese cambio.',\n    file_not_found: 'No se encontró la foto subida. Inténtalo de nuevo.',\n    invalid_path: 'No se pudo guardar la foto.',\n    empty_message: 'Escribe un mensaje.'\n  };\n  function errText(e, fallback) {\n    const raw = String((e && (e.message || e.msg || e.error_description)) || e || '');\n    for (const k in ERR) if (raw.indexOf(k) !== -1) return ERR[k];\n    if (/failed to fetch|networkerror|network request|load failed/i.test(raw)) return 'Sin conexión. Revisa tu internet e inténtalo otra vez.';\n    if (/jwt|expired|not authenticated/i.test(raw) || (e && e.code === 'PGRST301')) return 'Tu sesión caducó. Vuelve a iniciar sesión.';\n    if (e && e.code === '42501') return 'No tienes permiso para esta acción.';\n    console.error(e);\n    return fallback;\n  }\n  const muniId = () => (state.prov && state.muni) ? ids.muni[norm(state.prov) + '|' + norm(state.muni)] : undefined;\n\n\n  const num = s => { const n = parseFloat(String(s).replace(',', '.')); return isFinite(n) && n > 0 ? n : 0; };\n  const fmt = n => n ? String(Math.round(n * 100) / 100) : '';\n\n  function setView(v) {\n    if (v === 'idle') v = 'prov';   // Destino queda seleccionado por defecto (sin cartel de ayuda)\n    panel.dataset.view = v;\n    fDestino.setAttribute('aria-expanded', String(v === 'prov' || v === 'addr'));\n    fMonto.setAttribute('aria-expanded', String(v === 'monto'));\n    if (typeof navProv === 'function' && v === 'prov') navProv();\n  }\n  function refresh() {\n    fDestino.textContent = state.prov || 'Destino';\n    fDestino.classList.toggle('empty', !state.prov);\n    fMonto.textContent = state.usd ? fmt(state.usd) + ' USD' : 'Monto';\n    fMonto.classList.toggle('empty', !state.usd);\n    go.disabled = !(state.prov && state.usdt > 0 && state.cur);\n    provBtns.forEach(b => b.setAttribute('aria-pressed', String(b.textContent === state.prov)));\n  }\n\n  fDestino.addEventListener('click', () => {\n    const v = panel.dataset.view;\n    setView(v === 'prov' || v === 'addr' ? 'idle' : 'prov');\n  });\n  fMonto.addEventListener('click', () => {\n    setView(panel.dataset.view === 'monto' ? 'idle' : 'monto');\n    if (panel.dataset.view === 'monto') $('m-usd').focus();\n  });\n\n  provBtns.forEach(b => b.addEventListener('click', () => {\n    if (!provAvail(b.textContent)) { triggerHaptic(25); toast('No hay gestor disponible en ' + b.textContent + '.', 3200); return; }\n    if (state.prov !== b.textContent) { state.prov = b.textContent; state.muni = null; buildMunis(); resetQuote(); }\n    $('addr-prov').textContent = state.prov;\n    refresh(); setView('addr');\n    fitMunis(); alignMuni();\n  }));\n  $('addr-prov').addEventListener('click', () => setView('prov'));\n  $('addr-done').addEventListener('click', () => setView('idle'));\n\n  // ===== Municipios: se elige primero; flechas o deslizar con el dedo =====\n  const MUNIS = {\n    'Santiago': ['Contramaestre','Guamá','Mella','Palma Soriano','San Luis','Santiago de Cuba','Segundo Frente','Songo-La Maya','Tercer Frente'],\n    'Holguín': ['Antilla','Báguanos','Banes','Cacocum','Calixto García','Cueto','Frank País','Gibara','Holguín','Mayarí','Moa','Rafael Freyre','Sagua de Tánamo','Urbano Noris'],\n    'La Habana': ['Arroyo Naranjo','Boyeros','Centro Habana','Cerro','Cotorro','Diez de Octubre','Guanabacoa','Habana del Este','Habana Vieja','La Lisa','Marianao','Playa','Plaza de la Revolución','Regla','San Miguel del Padrón'],\n    'Las Tunas': ['Amancio','Colombia','Jesús Menéndez','Jobabo','Las Tunas','Majibacoa','Manatí','Puerto Padre'],\n    'Pinar del Río': ['Consolación del Sur','Guane','La Palma','Los Palacios','Mantua','Minas de Matahambre','Pinar del Río','San Juan y Martínez','San Luis','Sandino','Viñales'],\n    'Artemisa': ['Alquízar','Artemisa','Bahía Honda','Bauta','Caimito','Candelaria','Guanajay','Güira de Melena','Mariel','San Antonio de los Baños','San Cristóbal'],\n    'Mayabeque': ['Batabanó','Bejucal','Güines','Jaruco','Madruga','Melena del Sur','Nueva Paz','Quivicán','San José de las Lajas','San Nicolás de Bari','Santa Cruz del Norte'],\n    'Matanzas': ['Calimete','Cárdenas','Ciénaga de Zapata','Colón','Jagüey Grande','Jovellanos','Limonar','Los Arabos','Martí','Matanzas','Pedro Betancourt','Perico','Unión de Reyes'],\n    'Cienfuegos': ['Abreus','Aguada de Pasajeros','Cienfuegos','Cruces','Cumanayagua','Lajas','Palmira','Rodas'],\n    'Villa Clara': ['Caibarién','Camajuaní','Cifuentes','Corralillo','Encrucijada','Manicaragua','Placetas','Quemado de Güines','Ranchuelo','Remedios','Sagua la Grande','Santa Clara','Santo Domingo'],\n    'Sancti Spíritus': ['Cabaiguán','Fomento','Jatibonico','La Sierpe','Sancti Spíritus','Taguasco','Trinidad','Yaguajay'],\n    'Ciego de Ávila': ['Baraguá','Bolivia','Chambas','Ciego de Ávila','Ciro Redondo','Florencia','Majagua','Morón','Primero de Enero','Venezuela'],\n    'Camagüey': ['Camagüey','Carlos Manuel de Céspedes','Esmeralda','Florida','Guáimaro','Jimaguayú','Minas','Najasa','Nuevitas','Santa Cruz del Sur','Sibanicú','Sierra de Cubitas','Vertientes'],\n    'Granma': ['Bartolomé Masó','Bayamo','Buey Arriba','Campechuela','Cauto Cristo','Guisa','Jiguaní','Manzanillo','Media Luna','Niquero','Pilón','Río Cauto','Yara'],\n    'Guantánamo': ['Baracoa','Caimanera','El Salvador','Guantánamo','Imías','Maisí','Manuel Tames','Niceto Pérez','San Antonio del Sur','Yateras'],\n    'Isla de la Juventud': ['Isla de la Juventud']\n  };\n  const mStrip = $('muni-strip'), mPrev = $('muni-prev'), mNext = $('muni-next');\n  function navMunis() {\n    const max = mStrip.scrollWidth - mStrip.clientWidth;\n    mPrev.disabled = mStrip.scrollLeft <= 1;\n    mNext.disabled = mStrip.scrollLeft >= max - 1;\n  }\n  // Cada caja se ajusta a su palabra. Si no cabe en una línea, va en dos (una sobre otra); si aun así no cabe, baja un poco la letra.\n  function splitName(name, w) {\n    const words = name.split(' '); if (words.length < 2) return null;\n    let best = null, bw = Infinity;\n    for (let i = 1; i < words.length; i++) {\n      const a = words.slice(0, i).join(' '), b = words.slice(i).join(' '), m = Math.max(w(a), w(b));\n      if (m < bw) { bw = m; best = [a, b]; }\n    }\n    return best;\n  }\n  function fitMunis() {\n    const W = mStrip.clientWidth; if (!W) return;                 // oculto: se ajusta cuando se muestre\n    const cv = fitMunis.cv || (fitMunis.cv = document.createElement('canvas').getContext('2d'));\n    const first = mStrip.firstElementChild; if (!first) return;\n    const fam = getComputedStyle(first).fontFamily, avail = W - 16;   // 12 de relleno + 3 de borde + 1 de holgura\n    mStrip.querySelectorAll('.city').forEach(c => {\n      const name = c.dataset.name; let size = 12, lines = [name];\n      for (;;) {\n        cv.font = '700 ' + size + 'px ' + fam;\n        const w = t => cv.measureText(t).width;\n        if (w(name) <= avail) { lines = [name]; break; }\n        const sp = splitName(name, w);\n        if (sp && Math.max(w(sp[0]), w(sp[1])) <= avail) { lines = sp; break; }\n        if (size <= 10) { lines = sp || [name]; break; }\n        size -= 0.5;\n      }\n      c.style.fontSize = size + 'px';\n      const nodes = [];\n      lines.forEach((t, i) => { if (i) nodes.push(document.createElement('br')); nodes.push(document.createTextNode(t)); });\n      c.replaceChildren(...nodes);\n    });\n  }\n  window.addEventListener('resize', () => { if (panel.dataset.view === 'addr') { fitMunis(); alignMuni(); } });\n  function alignMuni() {\n    const selM = mStrip.querySelector('[aria-pressed=\"true\"]');\n    mStrip.scrollLeft = selM ? selM.offsetLeft : 0;\n    navMunis();\n  }\n  function pickMuni(btn) {\n    if (!isAvail(state.prov, btn.dataset.name)) {\n      state.muni = null; mStrip.querySelectorAll('.city').forEach(x => x.setAttribute('aria-pressed', 'false')); resetQuote();\n      triggerHaptic(25); toast('No hay gestor disponible en ' + btn.dataset.name + '.', 3200); return;\n    }\n    state.muni = btn.dataset.name;\n    mStrip.querySelectorAll('.city').forEach(c => c.setAttribute('aria-pressed', String(c === btn)));\n    scheduleQuote();\n  }\n  function buildMunis() {\n    mStrip.replaceChildren();\n    const list = MUNIS[state.prov] || [];\n    list.forEach(name => {\n      const c = document.createElement('button');\n      c.type = 'button';\n      c.className = 'city';\n      c.dataset.name = name;\n      c.setAttribute('aria-label', name);\n      c.textContent = name;\n      c.setAttribute('aria-pressed', 'false');\n      mStrip.appendChild(c);\n    });\n    mStrip.scrollLeft = 0;\n    markAvail();\n    if (list.length === 1) pickMuni(mStrip.firstElementChild);   // un solo municipio: queda elegido\n  }\n  mStrip.addEventListener('click', e => {\n    const c = e.target.closest('.city'); if (!c) return;\n    triggerHaptic(15);\n    pickMuni(c);\n    mStrip.scrollTo({ left: c.offsetLeft, behavior: 'smooth' });\n  });\n  // Flechas: pasan al municipio anterior / siguiente (las cajas tienen anchos distintos)\n  mPrev.addEventListener('click', () => {\n    triggerHaptic(10);\n    const cs = Array.from(mStrip.children).filter(c => c.offsetLeft < mStrip.scrollLeft - 2);\n    const t = cs[cs.length - 1];\n    mStrip.scrollTo({ left: t ? t.offsetLeft : 0, behavior: 'smooth' });\n  });\n  mNext.addEventListener('click', () => {\n    triggerHaptic(10);\n    const t = Array.from(mStrip.children).find(c => c.offsetLeft > mStrip.scrollLeft + 2);\n    if (t) mStrip.scrollTo({ left: t.offsetLeft, behavior: 'smooth' });\n  });\n  mStrip.addEventListener('scroll', navMunis, { passive: true });\n\n  // ===== Disponibilidad de gestores: sale de las zonas que cada gestor configuró en su cuenta =====\n  let avail = null;   // ids de municipio con gestor disponible; null = no se pudo saber (el servidor igual valida)\n  const isAvail = (prov, muni) => { if (!avail) return true; const id = ids.muni[norm(prov) + '|' + norm(muni)]; return id !== undefined && avail.has(id); };\n  const provAvail = prov => (MUNIS[prov] || []).some(m => isAvail(prov, m));\n  function markAvail() {\n    provBtns.forEach(b => b.classList.toggle('na', !provAvail(b.textContent)));\n    mStrip.querySelectorAll('.city').forEach(x => x.classList.toggle('na', !isAvail(state.prov, x.dataset.name)));\n  }\n  async function loadAvail() {\n    if (!sb) return;\n    try {\n      const { data, error } = await sb.rpc('available_municipalities', { p_currency: state.cur });\n      if (error) throw error;\n      avail = new Set((data || []).map(x => Number(x !== null && typeof x === 'object' ? Object.values(x)[0] : x)));\n      if (state.muni && !isAvail(state.prov, state.muni)) { state.muni = null; resetQuote(); toast('Ya no hay gestor disponible en ese municipio.', 3200); }\n    } catch (e) { console.warn('Disponibilidad no disponible:', e); }\n    markAvail();\n  }\n\n  // ===== Provincias: flechas arriba / abajo =====\n  const pList = $('prov-list'), pUp = $('prov-up'), pDown = $('prov-down');\n  const pStep = () => { const b = pList.querySelectorAll('.city'); return b.length > 1 ? (b[1].offsetTop - b[0].offsetTop) || 44 : 44; };\n  function navProv() {\n    const max = pList.scrollHeight - pList.clientHeight;\n    pUp.disabled = pList.scrollTop <= 1;\n    pDown.disabled = pList.scrollTop >= max - 1;\n  }\n  pUp.addEventListener('click', () => { triggerHaptic(10); pList.scrollBy({ top: -pStep(), behavior: 'smooth' }); });\n  pDown.addEventListener('click', () => { triggerHaptic(10); pList.scrollBy({ top: pStep(), behavior: 'smooth' }); });\n  pList.addEventListener('scroll', navProv, { passive: true });\n\n  // Monto: se escribe lo que se quiere entregar en USD; el equivalente en USDT lo calcula el servidor (quote_remittance)\n  const mUsd = $('m-usd'), mUsdt = $('m-usdt');\n  let quoteSeq = 0, quoteT = null;\n  function resetQuote() { quoteSeq++; clearTimeout(quoteT); state.usdt = 0; mUsdt.value = ''; refresh(); }\n  function scheduleQuote() {\n    clearTimeout(quoteT);\n    const seq = ++quoteSeq;\n    state.usdt = 0; mUsdt.value = ''; refresh();\n    const mid = muniId();\n    if (!sb || !state.usd) return;\n    if (!mid) { if (state.muni) toast('No se encontró ese municipio en el sistema.', 2600); return; }\n    quoteT = setTimeout(async () => {\n      const { data, error } = await sb.rpc('quote_remittance', { p_municipality_id: mid, p_currency: state.cur, p_amount: state.usd });\n      if (seq !== quoteSeq) return;                       // llegó una respuesta vieja: se ignora\n      if (error) { toast(errText(error, 'No se pudo calcular el monto.'), 3000); if (/no_operator_available/.test(String(error.message || ''))) loadAvail(); return; }\n      const row = Array.isArray(data) ? data[0] : data;\n      const v = row ? Number(row.expected_usdt) : 0;\n      if (!(v > 0)) { toast('No se pudo calcular el monto.', 2500); return; }\n      state.usdt = v; mUsdt.value = fmtUsdt(v); refresh();\n    }, 350);\n  }\n  mUsd.addEventListener('input', () => {\n    state.usd = Math.round(num(mUsd.value) * 100) / 100;\n    scheduleQuote();\n  });\n\n  // ===== Flujo de Bddh: Continuar → Wallet y Hash → ✓ → Estado de mensajería =====\n  const view1 = $('view-1'), view3 = $('view-3'), view4 = $('view-4');\n  function triggerHaptic(d) { try { if ('vibrate' in navigator) navigator.vibrate(d); } catch (e) {} }\n  const toastEl = $('toast-notification');\n  let toastT = null;\n  function toast(msg, ms, after) {\n    toastEl.textContent = msg;\n    toastEl.classList.add('show');\n    clearTimeout(toastT);\n    toastT = setTimeout(() => { toastEl.classList.remove('show'); if (after) after(); }, ms);\n  }\n  function showView(n) {\n    view1.classList.toggle('hidden', n !== 1);\n    view3.classList.toggle('hidden', n !== 3);\n    view4.classList.toggle('hidden', n !== 4);\n    $('view-5').classList.toggle('hidden', n !== 5);\n    document.querySelector('.title').textContent = n === 5 ? 'Operación completada' : 'Solicita tu mensajería';\n    confirmBox.hidden = true;\n    window.scrollTo({ top: 0 });\n  }\n\n  // ===== Flujo: Continuar (crea la remesa) → Wallet y Hash → ✓ → Foto del C.I. → Estado =====\n  function showWalletStep() {\n    const w = $('wallet-input');\n    w.value = current.wallet_snapshot || ''; w.readOnly = true;      // la wallet oficial viene del servidor, no se edita\n    $('hash-input').value = '';\n    showView(3);\n    toast('Envía ' + fmtUsdt(current.expected_usdt) + ' USDT' + (current.network ? ' por ' + current.network : '') + ' a esta wallet y pega el hash.', 5200);\n    startPolling();\n  }\n  go.addEventListener('click', async () => {\n    triggerHaptic(20);\n    if (!sb) { toast('Sin conexión con el servidor. Vuelve a iniciar sesión.', 3000); return; }\n    const calle = $('a-calle').value.trim(), edif = $('a-edif').value.trim(), ci = $('a-ci').value.trim(), tel = $('a-tel').value.trim();\n    const mid = muniId();\n    if (!mid) { toast('Elige un municipio.', 2000); setView('addr'); return; }\n    if (!calle) { toast('Escribe el reparto y la calle.', 2200); setView('addr'); return; }\n    if (!tel) { toast('Escribe un teléfono.', 2200); setView('addr'); return; }\n    const nombre = String(me.profile.full_name || '').trim();\n    if (!nombre) { toast('Completa tu nombre y apellido en Mi cuenta.', 3000); openAcc(); return; }\n    go.disabled = true; const txt0 = go.textContent; go.textContent = 'Creando…';\n    try {\n      // Antes de crear: se vuelve a calcular con la mejor oferta vigente; si cambió, el cliente la confirma\n      const q = await sb.rpc('quote_remittance', { p_municipality_id: mid, p_currency: state.cur, p_amount: state.usd });\n      if (q.error) throw q.error;\n      const qr = Array.isArray(q.data) ? q.data[0] : q.data, nv = qr ? Number(qr.expected_usdt) : 0;\n      if (!(nv > 0)) throw new Error('invalid_amount');\n      if (Math.abs(nv - state.usdt) > 0.004) {\n        state.usdt = nv; mUsdt.value = fmtUsdt(nv); refresh();\n        toast('La oferta cambió: ahora son ' + fmtUsdt(nv) + ' USDT. Toca Continuar para confirmar.', 4500); return;\n      }\n      const { data, error } = await sb.rpc('create_remittance', {\n        p_municipality_id: mid, p_currency: state.cur, p_amount: state.usd,\n        p_ben_name: nombre, p_ben_phone: tel, p_street: calle,\n        p_building: edif || null, p_ben_id_cp: ci || null, p_beneficiary_id: null, p_save_beneficiary: false\n      });\n      if (error) throw error;\n      const row = Array.isArray(data) ? data[0] : data;\n      if (!row || !row.id) throw new Error('create_remittance sin resultado');\n      current = row;\n      showWalletStep();\n    } catch (e) {\n      toast(errText(e, 'No se pudo crear la solicitud.'), 3500);\n    } finally {\n      go.textContent = txt0; refresh();\n    }\n  });\n\n  $('copiar-btn').addEventListener('click', function () {\n    const input = $('wallet-input');\n    const text = input.value.trim();\n    if (!text) { input.focus(); return; }\n    triggerHaptic(15);\n    const btn = this;\n    const done = () => {\n      btn.textContent = '¡Copiado!';\n      btn.style.background = 'linear-gradient(180deg, var(--g-ac-top), var(--g-ac-bot))';\n      btn.style.color = '#fff';\n      setTimeout(() => { btn.textContent = 'Copiar'; btn.style.background = ''; btn.style.color = ''; }, 1300);\n    };\n    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(() => { input.select(); try { document.execCommand('copy'); } catch (e) {} done(); });\n    else { input.select(); try { document.execCommand('copy'); } catch (e) {} done(); }\n  });\n\n  $('check-btn').addEventListener('click', async () => {\n    triggerHaptic(20);\n    if (!sb || !current) { toast('Primero crea la solicitud.', 2000); showView(1); return; }\n    const hash = $('hash-input').value.trim();\n    if (!hash) { $('hash-input').focus(); toast('Pega el hash de tu pago.', 2000); return; }\n    if (!/^0x[0-9a-fA-F]{64}$/.test(hash)) { toast(ERR.invalid_hash, 3200); return; }\n    const btn = $('check-btn'); btn.disabled = true;\n    try {\n      const { error } = await sb.rpc('submit_payment_hash', { p_remittance: current.id, p_tx_hash: hash });\n      if (error) throw error;\n      current.status = 'payment_submitted';\n      toast('Hash enviado. Tu pago será revisado.', 1800, () => {\n        showView(4); renderStatus(); startPolling();\n        setTimeout(() => { if (!view4.classList.contains('hidden')) { resetRequestForm(); showView(1); } }, 2600);   // Solicitud realizada → vuelve al inicio\n      });\n    } catch (e) {\n      toast(errText(e, 'No se pudo enviar el hash.'), 3500);\n    } finally { btn.disabled = false; }\n  });\n\n  // Deja la primera pantalla limpia para una nueva solicitud\n  function resetRequestForm() {\n    ['a-calle', 'a-edif', 'a-ci', 'a-tel', 'm-usd'].forEach(id => { $(id).value = ''; });\n    state.prov = null; state.muni = null; state.usd = 0; state.usdt = 0; mUsdt.value = '';\n    $('addr-prov').textContent = '';\n    try { buildMunis(); } catch (e) {}\n    resetQuote(); setView('prov'); refresh();\n  }\n\n  // ----- Estado de la solicitud (datos reales de public.remittances) -----\n  const STATUS_TXT = {\n    created: 'Solicitud creada', awaiting_payment: 'Esperando tu pago', payment_submitted: 'Pago en revisión',\n    payment_verified: 'Buscando mensajero', searching_operator: 'Buscando mensajero', offer_sent: 'Buscando mensajero',\n    operator_accepted: 'Mensajero asignado', in_delivery: 'Entrega en proceso', delivery_confirmed: 'Entrega en revisión',\n    pending_approval: 'Entrega realizada', rejected: 'Entrega en revisión', approved: 'Entrega completada',\n    settled: 'Entrega completada', cancelled: 'Solicitud cancelada'\n  };\n  function statusText(r) {\n    if (!r) return 'Sin estado todavía';\n    return STATUS_TXT[r.status] || r.status;\n  }\n  function renderStatus() {\n    const cards = document.querySelectorAll('#view-4 .status-card');\n    if (cards.length < 2 || !current) return;\n    cards[0].textContent = current.status === 'cancelled' ? 'Solicitud cancelada' : 'Solicitud completada';\n    cards[1].textContent = statusText(current) + (evidShown && EVID_STATUS.includes(current.status) ? ' · Ver evidencia' : '');\n  }\n  document.querySelectorAll('#view-4 .status-card')[1].addEventListener('click', () => {\n    if (evidShown && current && EVID_STATUS.includes(current.status)) { triggerHaptic(15); showView(5); }\n  });\n  let pollT = null;\n  async function refreshCurrent() {\n    if (!sb || !current) return null;\n    const { data, error } = await sb.from('remittances').select('*').eq('id', current.id).maybeSingle();\n    if (error || !data) return null;\n    current = data; renderStatus();\n    if (EVID_STATUS.includes(data.status)) loadEvidence(true);\n    return data;\n  }\n  function startPolling() {\n    clearInterval(pollT);\n    pollT = setInterval(() => { if (current && !FINAL.includes(current.status)) refreshCurrent(); }, 20000);\n  }\n\n  // ----- Vista 5: evidencia de entrega (la foto que toma el gestor al entregar el dinero) -----\n  const EVID_STATUS = ['pending_approval', 'approved', 'settled'];\n  const EVID_EMPTY = $('ci-preview').innerHTML;\n  let evidShown = null, evidFor = null;\n  async function loadEvidence(auto) {\n    if (!sb || !current) return false;\n    if (evidFor !== current.id) { $('ci-preview').innerHTML = EVID_EMPTY; evidShown = null; evidFor = current.id; }\n    try {\n      const { data, error } = await sb.rpc('get_delivery_evidence', { p_remittance: current.id });\n      if (error) throw error;\n      const row = Array.isArray(data) ? data[0] : data;\n      if (!row || !row.path) return false;\n      if (row.path !== evidShown) {\n        const s = await sb.storage.from('delivery-evidence').createSignedUrl(row.path, 3600);\n        if (s.error || !s.data) throw (s.error || new Error('sin_url'));\n        const img = document.createElement('img'); img.src = s.data.signedUrl; img.alt = 'Evidencia de entrega';\n        $('ci-preview').replaceChildren(img); evidShown = row.path;\n        renderStatus();\n        if (auto) loadMsgs();\n      }\n      return true;\n    } catch (e) { console.warn('Evidencia no disponible:', e); return false; }\n  }\n  $('ci-consult').addEventListener('click', async () => {\n    triggerHaptic(15);\n    if (!sb || !current) { toast('Sin estado todavía', 1600); return; }\n    const r = await refreshCurrent();\n    const ok = await loadEvidence(false);\n    toast(ok ? 'Evidencia cargada' : 'Aún no hay evidencia. Estado: ' + statusText(r || current), 2600);\n  });\n  $('ci-ok').addEventListener('click', () => {\n    triggerHaptic(20);\n    showView(1);   // vuelve a la primera pantalla\n  });\n\n  // Burbujas de feedback y ajustes\n  const sheets = { fb: $('sheet-feedback'), set: $('sheet-settings') };\n  const btns = { fb: $('b-fb'), set: $('b-set') };\n  function toggle(k) {\n    Object.keys(sheets).forEach(j => {\n      const open = j === k && sheets[j].hidden;\n      sheets[j].hidden = !open;\n      btns[j].setAttribute('aria-expanded', String(open));\n    });\n  }\n  btns.fb.addEventListener('click', () => {\n    toggle('fb');\n    if (!sheets.fb.hidden) loadMsgs().then(() => setTimeout(async () => { if (!sheets.fb.hidden) { await markMsgsRead(); renderMsgs(); } }, 1400));\n  });\n  btns.set.addEventListener('click', () => toggle('set'));\n  function closeSheets() {\n    Object.keys(sheets).forEach(j => { sheets[j].hidden = true; btns[j].setAttribute('aria-expanded', 'false'); });\n  }\n  document.addEventListener('click', e => {\n    if (Object.values(sheets).every(s => s.hidden)) return;\n    if (e.target.closest('.sheet, .bubble')) return;\n    closeSheets();\n  });\n  $('fbsend').addEventListener('click', async () => {\n    const t = $('fb');\n    if (!t.value.trim()) { t.focus(); return; }\n    if (!sb) { toast('Sin conexión con el servidor.', 2400); return; }\n    const b = $('fbsend'); b.disabled = true;\n    try {\n      const { error } = await sb.rpc('send_feedback', { p_message: t.value.trim() });\n      if (error) throw error;\n      t.value = ''; toggle('fb');\n      confirmBox.hidden = false; confirmBox.textContent = 'Gracias por tu mensaje.';\n    } catch (e) {\n      toast(errText(e, 'No se pudo enviar tu mensaje.'), 3000);\n    } finally { b.disabled = false; }\n  });\n  // ----- Mensajes: los avisos del servidor (dinero entregado, etc.) llegan al icono de mensaje -----\n  let msgs = [];\n  const MSG_EVID = ['delivery_done', 'delivery_approved'];\n  function renderMsgs() {\n    const list = $('msg-list'), badge = $('msg-badge');\n    const unread = msgs.filter(m => !m.read_at).length;\n    badge.hidden = !unread; badge.textContent = String(unread);\n    $('b-fb').setAttribute('aria-label', 'Mensajes' + (unread ? ', ' + unread + ' sin leer' : ''));\n    list.innerHTML = '';\n    if (!msgs.length) { const p = document.createElement('p'); p.className = 'msg-empty'; p.textContent = 'Aún no tienes mensajes'; list.appendChild(p); return; }\n    msgs.forEach(m => {\n      const it = document.createElement('div'); it.className = 'msg-item' + (m.read_at ? '' : ' unread');\n      const t = document.createElement('b'); t.textContent = m.title || 'Aviso'; it.appendChild(t);\n      if (m.body) { const s = document.createElement('span'); s.textContent = m.body; it.appendChild(s); }\n      const d = new Date(m.created_at), w = document.createElement('small');\n      w.textContent = d.toLocaleDateString('es', { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });\n      it.appendChild(w);\n      if (m.remittance_id && MSG_EVID.includes(m.type)) {\n        const b = document.createElement('button'); b.type = 'button'; b.className = 'city'; b.textContent = 'Ver evidencia';\n        b.addEventListener('click', () => { triggerHaptic(15); openEvidenceFor(m.remittance_id); });\n        it.appendChild(b);\n      }\n      list.appendChild(it);\n    });\n  }\n  async function loadMsgs() {\n    if (!sb || !me.uid) return;\n    try {\n      const { data, error } = await sb.from('notifications').select('*').order('created_at', { ascending: false }).limit(20);\n      if (!error && Array.isArray(data)) { msgs = data; renderMsgs(); }\n    } catch (e) { console.warn('Mensajes no disponibles:', e); }\n  }\n  async function markMsgsRead() {\n    const ids = msgs.filter(m => !m.read_at).map(m => m.id);\n    if (!ids.length || !sb) return;\n    try { await sb.rpc('mark_notifications_read', { p_ids: ids }); msgs.forEach(m => { if (!m.read_at) m.read_at = new Date().toISOString(); }); } catch (e) {}\n  }\n  async function openEvidenceFor(rid) {\n    if (!sb) return;\n    if (!$('view-3').classList.contains('hidden')) { toast('Termina primero tu pago actual.', 2400); return; }\n    const { data } = await sb.from('remittances').select('*').eq('id', rid).maybeSingle();\n    if (!data) { toast('No se encontró la operación.', 2200); return; }\n    current = data;\n    if (await loadEvidence(false)) { closeSheets(); showView(5); } else toast('La evidencia aún no está disponible.', 2400);\n  }\n  setInterval(loadMsgs, 30000);\n  document.querySelectorAll('.switch').forEach(sw => sw.addEventListener('click', () =>\n    sw.setAttribute('aria-checked', String(sw.getAttribute('aria-checked') !== 'true'))));\n  // ----- Mi cuenta: página que entra deslizando -----\n  const accPage = $('acc-page');\n  const acF = { user: $('ac-user'), pass: $('ac-pass'), nombre: $('ac-nombre'), edad: $('ac-edad'), ci: $('ac-ci'), tel: $('ac-tel') };\n  function setAvatar(src) {\n    const av = $('acc-avatar'), top = $('set-avatar');\n    [av, top].forEach(b => {\n      if (!b._icon) b._icon = b.firstElementChild;\n      if (src) { const img = document.createElement('img'); img.src = src; img.alt = ''; b.replaceChildren(img); }\n      else b.replaceChildren(b._icon);\n    });\n  }\n  function openAcc() { closeSheets(); acF.pass.value = ''; triggerHaptic(10); accPage.classList.add('open'); accPage.setAttribute('aria-hidden', 'false'); accPage.scrollTop = 0; }\n  function closeAcc() { accPage.classList.remove('open'); accPage.setAttribute('aria-hidden', 'true'); if (document.activeElement) document.activeElement.blur(); }\n  $('set-acc').addEventListener('click', openAcc);\n  $('acc-back').addEventListener('click', closeAcc);\n  document.addEventListener('keydown', e => { if (e.key === 'Escape' && accPage.classList.contains('open')) closeAcc(); });\n\n  $('ac-see').addEventListener('click', function () {\n    const show = acF.pass.type === 'password';\n    acF.pass.type = show ? 'text' : 'password';\n    this.textContent = show ? 'Ocultar' : 'Ver';\n  });\n\n  const accFile = $('acc-file');\n  $('acc-photo-btn').addEventListener('click', () => accFile.click());\n  $('acc-avatar').addEventListener('click', () => accFile.click());\n  accFile.addEventListener('change', function () {\n    const f = this.files && this.files[0]; if (!f) return;\n    const input = this;\n    const rd = new FileReader();\n    rd.onload = () => {\n      const im = new Image();\n      im.onload = () => {\n        const S = 240, c = document.createElement('canvas'); c.width = c.height = S;\n        const k = Math.max(S / im.width, S / im.height), w = im.width * k, h = im.height * k;\n        c.getContext('2d').drawImage(im, (S - w) / 2, (S - h) / 2, w, h);\n        c.toBlob(async b => {\n          if (!b) { toast('No se pudo leer la imagen.', 2000); return; }\n          if (!sb || !me.uid) { toast('Sin conexión con el servidor.', 2400); return; }\n          try {\n            const path = me.uid + '/avatar.jpg';\n            const up = await sb.storage.from('avatars').upload(path, b, { contentType: 'image/jpeg', upsert: true });\n            if (up.error) throw up.error;\n            const r = await sb.from('profiles').update({ avatar_path: path }).eq('id', me.uid).select('id');\n            if (r.error) throw r.error;\n            me.profile.avatar_path = path;\n            setAvatar(avatarUrl(path));\n            toast('Foto actualizada', 1500);\n          } catch (e) { toast(errText(e, 'No se pudo guardar la foto.'), 3000); }\n        }, 'image/jpeg', 0.85);\n      };\n      im.src = rd.result;\n    };\n    rd.readAsDataURL(f);\n    input.value = '';\n  });\n\n  $('ac-save').addEventListener('click', async () => {\n    if (!sb || !me.uid) { toast('Sin conexión con el servidor.', 2400); return; }\n    const user = acF.user.value.trim().toLowerCase();\n    if (!/^[a-z0-9_.-]{3,30}$/.test(user)) { acF.user.focus(); toast('Usuario: de 3 a 30 caracteres (minúsculas, números, _ . -).', 3000); return; }\n    let edad = null;\n    if (acF.edad.value.trim()) { edad = parseInt(acF.edad.value.trim(), 10); if (!(edad >= 0 && edad <= 120)) { acF.edad.focus(); toast('Escribe una edad válida.', 2000); return; } }\n    const pass = acF.pass.value;\n    if (pass && pass.length < 8) { acF.pass.focus(); toast('La contraseña debe tener al menos 8 caracteres.', 2600); return; }\n    const btn = $('ac-save'); btn.disabled = true;\n    try {\n      const upd = { username: user, full_name: acF.nombre.value.trim() || null, age: edad, national_id: acF.ci.value.trim() || null, phone: acF.tel.value.trim() || null };\n      const r = await sb.from('profiles').update(upd).eq('id', me.uid).select('id');\n      if (r.error) throw r.error;\n      if (!r.data || !r.data.length) throw new Error('No se pudo guardar tu perfil.');\n      Object.assign(me.profile, upd);\n      let samePass = false;\n      if (pass) {\n        const p = await sb.auth.updateUser({ password: pass });\n        if (p.error) { if (p.error.code === 'same_password' || /different from the old/i.test(String(p.error.message || ''))) samePass = true; else throw p.error; }\n      }\n      acF.pass.value = ''; acF.pass.type = 'password'; $('ac-see').textContent = 'Ver';\n      triggerHaptic(20);\n      closeAcc();\n      toast(pass && !samePass ? 'Cambios y contraseña guardados' : 'Cambios guardados', 1600);\n    } catch (e) {\n      if (e && e.code === 'weak_password') toast('Esa contraseña es muy débil. Usa una más larga.', 3000);\n      else if (e && e.code === '23505') toast('Ese nombre de =\"ac-out\" type=\"button\">Cerrar sesión<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div id=\"dlg-back\" class=\"dlg-back\" hidden>\n  <div id=\"dlg-entrega\" class=\"sheet dlg\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"dlg-title\">\n    <h2 id=\"dlg-title\">Solicitud de entrega<span id=\"d-timer\"><\/span><\/h2>\n    <div class=\"frow\"><label for=\"d-user\">Solicitud<\/label><input class=\"base-in\" id=\"d-user\" type=\"text\" value=\"\" readonly aria-label=\"Solicitud\"><\/div>\n    <div class=\"frow top\"><label for=\"d-ubic\">Ubicación<\/label><textarea id=\"d-ubic\" readonly aria-label=\"Ubicación\"><\/textarea><\/div>\n    <div class=\"frow\"><label for=\"d-tel\">Teléfono<\/label><input class=\"base-in\" id=\"d-tel\" type=\"tel\" value=\"\" readonly aria-label=\"Teléfono\"><\/div>\n    <div class=\"frow\"><label for=\"d-cant\">Cantidad<\/label><input class=\"base-in\" id=\"d-cant\" type=\"text\" value=\"\" readonly aria-label=\"Cantidad\"><\/div>\n    <div class=\"frow\"><label for=\"d-id\">ID de operación<\/label><input class=\"base-in\" id=\"d-id\" type=\"text\" value=\"\" readonly aria-label=\"ID de operación\"><\/div>\n    <p class=\"ofhint\" style=\"margin:0 0 6px\">El nombre del beneficiario se muestra cuando tomas la operación.<\/p>\n    <div class=\"dlg-msg\" id=\"d-msgbox\" hidden>\n      <textarea id=\"d-msg\" placeholder=\"Escribe tu queja o reclamo\" aria-label=\"Mensaje para una queja o reclamo\"><\/textarea>\n      <button class=\"send\" id=\"d-send\" type=\"button\">Enviar<\/button>\n    <\/div>\n    <div class=\"actions\">\n      <button class=\"city\" id=\"d-consultar\" type=\"button\" aria-pressed=\"false\" aria-expanded=\"false\" aria-controls=\"d-msgbox\">Consultar<\/button>\n      <button class=\"city\" id=\"d-dejar\" type=\"button\">Dejar ir<\/button>\n      <button class=\"done\" id=\"d-tomar\" type=\"button\">Tomar<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<script>\n  const $ = id => document.getElementById(id);\n  const panel = $('panel');\n  const fDispo = $('f-dispo'), fOferta = $('f-oferta');\n  const go = $('go'), confirmBox = $('confirm');\n  const provBtns = Array.from(document.querySelectorAll('[data-for=\"prov\"] .city'));\n  const mlist = $('mlist');\n\n  // Municipios de Cuba por provincia (168 en total, incluida la Isla de la Juventud)\n  const MUNI = {\n    \"Pinar del Río\": \"Consolación del Sur|Guane|La Palma|Los Palacios|Mantua|Minas de Matahambre|Pinar del Río|San Juan y Martínez|San Luis|Sandino|Viñales\".split(\"|\"),\n    \"Artemisa\": \"Alquízar|Artemisa|Bahía Honda|Bauta|Caimito|Candelaria|Guanajay|Güira de Melena|Mariel|San Antonio de los Baños|San Cristóbal\".split(\"|\"),\n    \"La Habana\": \"Arroyo Naranjo|Boyeros|Centro Habana|Cerro|Cotorro|Diez de Octubre|Guanabacoa|Habana del Este|Habana Vieja|La Lisa|Marianao|Playa|Plaza de la Revolución|Regla|San Miguel del Padrón\".split(\"|\"),\n    \"Mayabeque\": \"Batabanó|Bejucal|Güines|Jaruco|Madruga|Melena del Sur|Nueva Paz|Quivicán|San José de las Lajas|San Nicolás|Santa Cruz del Norte\".split(\"|\"),\n    \"Matanzas\": \"Calimete|Cárdenas|Ciénaga de Zapata|Colón|Jagüey Grande|Jovellanos|Limonar|Los Arabos|Martí|Matanzas|Pedro Betancourt|Perico|Unión de Reyes\".split(\"|\"),\n    \"Cienfuegos\": \"Abreus|Aguada de Pasajeros|Cienfuegos|Cruces|Cumanayagua|Lajas|Palmira|Rodas\".split(\"|\"),\n    \"Villa Clara\": \"Caibarién|Camajuaní|Cifuentes|Corralillo|Encrucijada|Manicaragua|Placetas|Quemado de Güines|Ranchuelo|Remedios|Sagua la Grande|Santa Clara|Santo Domingo\".split(\"|\"),\n    \"Sancti Spíritus\": \"Cabaiguán|Fomento|Jatibonico|La Sierpe|Sancti Spíritus|Taguasco|Trinidad|Yaguajay\".split(\"|\"),\n    \"Ciego de Ávila\": \"Baraguá|Bolivia|Chambas|Ciego de Ávila|Ciro Redondo|Florencia|Majagua|Morón|Primero de Enero|Venezuela\".split(\"|\"),\n    \"Camagüey\": \"Camagüey|Carlos M. de Céspedes|Esmeralda|Florida|Guáimaro|Jimaguayú|Minas|Najasa|Nuevitas|Santa Cruz del Sur|Sibanicú|Sierra de Cubitas|Vertientes\".split(\"|\"),\n    \"Las Tunas\": \"Amancio|Colombia|Jesús Menéndez|Jobabo|Las Tunas|Majibacoa|Manatí|Puerto Padre\".split(\"|\"),\n    \"Holguín\": \"Antilla|Báguanos|Banes|Cacocum|Calixto García|Cueto|Frank País|Gibara|Holguín|Mayarí|Moa|Rafael Freyre|Sagua de Tánamo|Urbano Noris\".split(\"|\"),\n    \"Granma\": \"Bartolomé Masó|Bayamo|Buey Arriba|Campechuela|Cauto Cristo|Guisa|Jiguaní|Manzanillo|Media Luna|Niquero|Pilón|Río Cauto|Yara\".split(\"|\"),\n    \"Santiago\": \"Contramaestre|Guamá|Mella|Palma Soriano|San Luis|Santiago de Cuba|Segundo Frente|Songo-La Maya|Tercer Frente\".split(\"|\"),\n    \"Guantánamo\": \"Baracoa|Caimanera|El Salvador|Guantánamo|Imías|Maisí|Manuel Tames|Niceto Pérez|San Antonio del Sur|Yateras\".split(\"|\"),\n    \"Isla de la Juventud\": \"Isla de la Juventud\".split(\"|\")\n  };\n\n  let STEP = 0.5, MIN = 1.5, MAX = 100;   // oferta en %: sube de 0,5 en 0,5; los límites reales llegan de Supabase\n  const state = { prov: null, sel: {}, oferta: 0 };      // sel: provincia -> Set de municipios elegidos\n\n  const parse = s => { const n = parseFloat(String(s).replace(',', '.')); return isFinite(n) && n > 0 ? Math.min(n, MAX) : 0; };\n  const fmt = n => String(Math.round(n * 1000) / 1000).replace('.', ',');\n  const countMuni = () => Object.keys(state.sel).reduce((a, k) => a + state.sel[k].size, 0);\n  let VIB = true, NOTIF = true;\n  function triggerHaptic(d) { try { if (VIB && 'vibrate' in navigator) navigator.vibrate(d); } catch (e) {} }\n\n  function setView(v) {\n    panel.dataset.view = v;\n    fDispo.setAttribute('aria-expanded', String(v === 'prov' || v === 'muni'));\n    fOferta.setAttribute('aria-expanded', String(v === 'oferta'));\n  }\n  function refresh() {\n    const n = countMuni();\n    let label = 'Disponible en';\n    if (n === 1) { const k = Object.keys(state.sel).find(p => state.sel[p].size); label = Array.from(state.sel[k])[0]; }\n    else if (n > 1) label = n + ' municipios';\n    fDispo.textContent = label;\n    fDispo.classList.toggle('sm', label.length > 11); fDispo.classList.toggle('xs', label.length > 17);\n    fDispo.classList.toggle('empty', n === 0);\n    fOferta.textContent = state.oferta ? fmt(state.oferta) + ' %' : 'Mi oferta';\n    fOferta.classList.toggle('empty', !state.oferta);\n    go.disabled = !(n > 0 && state.oferta >= MIN - 1e-9);\n    provBtns.forEach(b => b.setAttribute('aria-pressed', String(!!(state.sel[b.textContent] && state.sel[b.textContent].size))));\n  }\n\n  // ----- Disponible en: provincias → municipios -----\n  fDispo.addEventListener('click', () => setView('prov'));      // siempre hay un panel abierto: nunca queda vacío\n  fOferta.addEventListener('click', () => setView('oferta'));\n\n  function openProv(p) {\n    state.prov = p;\n    $('muni-prov').querySelector('span').textContent = p;\n    mlist.textContent = '';\n    const set = state.sel[p] || (state.sel[p] = new Set());\n    (MUNI[p] || []).forEach(m => {\n      const b = document.createElement('button');\n      b.className = 'city' + (m.length > 12 ? ' sm' : ''); b.type = 'button'; b.textContent = m;\n      b.setAttribute('aria-pressed', String(set.has(m)));\n      b.addEventListener('click', () => {\n        triggerHaptic(15);\n        if (set.has(m)) set.delete(m); else set.add(m);\n        b.setAttribute('aria-pressed', String(set.has(m)));\n        refresh();\n      });\n      mlist.appendChild(b);\n    });\n    mlist.scrollTop = 0;\n    setView('muni');\n  }\n  provBtns.forEach(b => b.addEventListener('click', () => { triggerHaptic(15); openProv(b.textContent); }));\n  $('muni-prov').addEventListener('click', () => setView('prov'));\n\n  // ----- Mi oferta: número con flechas de 0,005 en 0,005 (mínimo 1,015) -----\n  const oVal = $('o-val');\n  function stepOferta(dir) {\n    const v = state.oferta, k = v / STEP;\n    let n = dir > 0 ? (Math.floor(k + 1e-6) + 1) * STEP : (Math.ceil(k - 1e-6) - 1) * STEP;   // siguiente múltiplo de 0,005\n    n = Math.round(n * 1000) / 1000;\n    if (v === 0 && dir < 0) n = 0;                       // vacío: la flecha de bajar no hace nada\n    else n = Math.min(MAX, Math.max(MIN, n));            // nunca por debajo de 1,015\n    state.oferta = n;\n    oVal.value = fmt(n);\n    oVal.classList.toggle('long', oVal.value.length > 4);\n    refresh();\n  }\n  oVal.addEventListener('input', () => {\n    oVal.value = oVal.value.replace(/[^0-9.,]/g, '').replace(/([.,])(?=.*[.,])/g, '');\n    oVal.classList.toggle('long', oVal.value.length > 4);\n    state.oferta = parse(oVal.value);\n    refresh();\n  });\n  oVal.addEventListener('blur', () => { if (state.oferta > 0 && state.oferta < MIN) { state.oferta = MIN; refresh(); } oVal.value = state.oferta ? fmt(state.oferta) : (oVal.value ? '0' : ''); });\n  [['o-up', 1], ['o-dn', -1]].forEach(([id, dir]) => {\n    const btn = $(id);\n    let t1 = null, t2 = null;\n    const stop = () => { clearTimeout(t1); clearInterval(t2); t1 = t2 = null; };\n    btn.addEventListener('pointerdown', e => {\n      e.preventDefault();                                     // no quita el foco ni abre el teclado\n      triggerHaptic(12); stepOferta(dir);\n      t1 = setTimeout(() => { t2 = setInterval(() => { triggerHaptic(8); stepOferta(dir); }, 110); }, 420);   // mantener pulsado repite\n    });\n    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, stop));\n    btn.addEventListener('click', e => { if (e.detail === 0) stepOferta(dir); });      // teclado (Enter / espacio)\n  });\n\n  // ----- Continuar -----\n  const toastEl = $('toast-notification');\n  let toastT = null;\n  function toast(msg, ms, after) {\n    if (!NOTIF) { if (after) after(); return; }          // Notificaciones apagadas: no sale el cartel\n    toastEl.textContent = msg;\n    toastEl.classList.add('show');\n    clearTimeout(toastT);\n    toastT = setTimeout(() => { toastEl.classList.remove('show'); if (after) after(); }, ms);\n  }\n\n  \n  // Burbujas de feedback y ajustes\n  const sheets = { fb: $('sheet-feedback'), set: $('sheet-settings') };\n  const btns = { fb: $('b-fb'), set: $('b-set') };\n  function toggle(k) {\n    Object.keys(sheets).forEach(j => {\n      const open = j === k && sheets[j].hidden;\n      sheets[j].hidden = !open;\n      btns[j].setAttribute('aria-expanded', String(open));\n    });\n  }\n  btns.fb.addEventListener('click', () => toggle('fb'));\n  btns.set.addEventListener('click', () => toggle('set'));\n\n  // Tocar fuera de la ventana de ajustes (o de feedback) la cierra\n  document.addEventListener('pointerdown', e => {\n    if (e.target.closest('.sheet, .bottom')) return;\n    if (!sheets.fb.hidden || !sheets.set.hidden) toggle(null);\n  });\n  $('fbsend').addEventListener('click', () => {\n    const t = $('fb');\n    if (!t.value.trim()) { t.focus(); return; }\n    if (window.suprenvFeedback) window.suprenvFeedback(t.value.trim());\n    t.value = ''; toggle('fb');\n    toast('Gracias por tu mensaje.', 1800);\n  });\n  // Notificaciones y vibración: funcionan de verdad y se recuerdan\n  const swNotif = $('sw-notif'), swVib = $('sw-vib');\n  const getPref = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v === '1'; } catch (e) { return d; } };\n  const setPref = (k, v) => { try { localStorage.setItem(k, v ? '1' : '0'); } catch (e) {} };\n  NOTIF = getPref('suprenv_notif', true); VIB = getPref('suprenv_vib', true);\n  swNotif.setAttribute('aria-checked', String(NOTIF)); swVib.setAttribute('aria-checked', String(VIB));\n  swNotif.addEventListener('click', () => {\n    NOTIF = !NOTIF; setPref('suprenv_notif', NOTIF); swNotif.setAttribute('aria-checked', String(NOTIF));\n  });\n  swVib.addEventListener('click', () => {\n    VIB = !VIB; setPref('suprenv_vib', VIB); swVib.setAttribute('aria-checked', String(VIB));\n    if (VIB) triggerHaptic(25);\n  });\n  // ----- Modo claro / oscuro -----\n  const swDark = $('sw-dark'), metaTheme = document.querySelector('meta[name=\"theme-color\"]');\    const sc = 1 + 0.1 * Math.sin(ang), id = li + ':' + ii;\n        out.push({ id, x, y, r: it.d / 2 * sc, sc, it, moon: false });\n        if (it.moon) {\n          const m = it.moon, R = (it.d / 2 + m.d / 2 + m.gap) * sc, phi = m.ph * Math.PI / 180 + m.om * t;\n          out.push({ id: id + 'm', parent: id, x: x + R * Math.cos(phi), y: y + R * Math.sin(phi), r: m.d / 2 * sc, sc, it: m, moon: true });\n        }\n      });\n    });\n    return out;\n  }\n  //<\/LAYOUT>\n\n  // Bolitas 3D (tonos verde azulado): luz, sombra, brillo y luz rebotada; cada color: [luz, medio, sombra, borde, resplandor]\n  const TINTS = [\n    ['#d2fff7', '#43e0cf', '#0f8f88', '#03302f', 'rgba(67,224,207,.35)'],\n    ['#d6f6ff', '#4cc3ea', '#12739a', '#04243a', 'rgba(76,195,234,.35)'],\n    ['#d9ffea', '#55e3a6', '#12865f', '#03301f', 'rgba(85,227,166,.33)'],\n    ['#c4f8f3', '#2bbfb6', '#0b6a68', '#032a2a', 'rgba(43,191,182,.33)']\n  ];\n  const sprites = {};\n  function buildSpheres() {\n    layout(0, 0, 0, 430).forEach(o => {\n      const w = document.createElement('div'), T = TINTS[o.it.tint];\n      w.className = 'planet sphere';\n      w.style.width = w.style.height = o.it.d + 'px';\n      ['--s1', '--s2', '--s3', '--s4', '--sg'].forEach((k, i) => w.style.setProperty(k, T[i]));\n      document.body.appendChild(w);\n      sprites[o.id] = w;\n    });\n  }\n  let tNow = 0;\n  function place(t) {\n    tNow = t;\n    const mm = balls[0], W = table();\n    layout(t, mm.x, mm.y, W.x1 - W.x0).forEach(o => {\n      const w = sprites[o.id];\n      if (!w) return;\n      w.style.transform = 'translate(' + (o.x - o.it.d / 2).toFixed(1) + 'px,' + (o.y - o.it.d / 2).toFixed(1) + 'px) scale(' + o.sc.toFixed(3) + ')';\n      w.style.zIndex = o.y < mm.y ? 0 : 1;\n    });\n  }\n\n  // ----- inclinación del celular -----\n  const sensor = { on: false, b: 0, g: 0, gx: 0, gy: 0 };\n  function onOri(e) {\n    if (e.beta == null || e.gamma == null) return;\n    if (!sensor.on) { sensor.on = true; sensor.b etContext('2d').drawImage(img, 0, 0, cv.width, cv.height);\n          cv.toBlob(b => b ? res({ blob: b, url: URL.createObjectURL(b) }) : rej(new Error('blob')), 'image/jpeg', 0.75);\n        };\n        img.src = r.result;\n      };\n      r.readAsDataURL(file);\n    });\n  }\n  const CAM = '<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 8h3l1.6-2.4h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z\"/><circle cx=\"12\" cy=\"13\" r=\"3.6\"/><\/svg>';\n\n  async function sendEvidence(a, btn) {\n    const ph = photos.get(a.assignment_id); if (!ph) return;\n    btn.disabled = true; hap(25);\n    try {\n      if (a.remittance_status === 'operator_accepted') { const s = await sb.rpc('start_delivery', { p_assignment: a.assignment_id }); if (s.error) throw s.error; }\n      const path = uid + '/' + a.remittance_id + '/' + Date.now() + '.jpg';\n      const up = await sb.storage.from('delivery-evidence').upload(path, ph.blob, { contentType: 'image/jpeg', upsert: false });\n      if (up.error) throw up.error;\n      const r = await sb.rpc('confirm_delivery', { p_assignment: a.assignment_id, p_evidence_path: path });\n      if (r.error) throw r.error;\n      photos.delete(a.assignment_id); toast('Entrega enviada. El administrador la revisará.', 2600);\n    } catch (e) { console.error('Enviar evidencia:', e); toast(errMsg(e), 3600); }\n    finally { btn.disabled = false; await pollAssign(); }\n  }\n\n  function opCard(a) {\n    const c = h('article', 'op');\n    const offered = a.assignment_status === 'offered';\n    const rs = a.remittance_status;\n    const st = offered ? ['Oferta', 'pend'] : rs === 'approved' ? ['Aprobada', 'ok'] : rs === 'pending_approval' ? ['En revisión', 'pend']\n             : rs === 'rejected' ? ['Rechazada', 'pend'] : ['Pendiente', 'pend'];\n    const top = h('div', 'op-top'); top > Number(n).toLocaleString('es', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n  function renderAccount() {\n    if (!cfg) return;\n    const ver = $('ac-ver');\n    ver.textContent = !cfg.verified ? 'Pendiente' : !cfg.active ? 'Desactivado' : 'Verificado';\n    ver.className = 'op-st ' + (cfg.verified && cfg.active ? 'ok' : 'pend');\n    $('ac-ver-note').hidden = cfg.verified && cfg.active;\n    $('ac-ver-note').textContent = !cfg.verified ? 'El administrador debe verificar tu cuenta. Hasta entonces no recibirás operaciones.' : 'Tu cuenta está desactivada. Habla con el administrador.';\n    $('sw-avail').setAttribute('aria-checked', String(!!cfg.accepting));\n    if (document.activeElement !== $('ac-wallet')) $('ac-wallet').value = cfg.payout_wallet || '';\n    $('ac-cupo').textContent = prof ? String(prof.max_active) + (prof.max_active === 1 ? ' operación a la vez' : ' operaciones a la vez') : '—';\n    $('ac-done').textContent = prof ? String(prof.total_operations) : '—';\n    const box = $('ac-pays'); box.textContent = '';\n    if (!pays.length) box.append(h('p', 'ofhint', 'Todavía no tienes cobros.'));\n    else {\n      const paid = pays.filter(p => p.status === 'paid').reduce((s, p) => s + Number(p.amount_usdt), 0);\n      const pend = pays.filter(p => p.status !== 'paid').reduce((s, p) => s + Number(p.amount_usdt), 0);\n      box.append(h('p', 'ofhint', 'Cobrado: ' + money(paid) + ' USDT · Por cobrar: ' + money(pend) + ' USDT'));\n      pays.forEach(p => {\n        const l = h('div', 'ac-line'); l.append(h('b', '', money(p.amount_usdt) + ' USDT · ' + (p.status === 'paid' ? 'Pagado' : 'Autorizado, por pagar')));\n        if (p.tx_hash) l.append(h('small', '', 'Hash: ' + p.tx_hash.slice(0, 10) + '…' + p.tx_hash.slice(-6)));\n        box.append(l);\n      });\n    }\n    const mb = $('ac-msgs'); mb.textContent = '';\n    if (!notifs.length) mb.append(h('p', 'ofhint', 'No tienes mensajes.'));\n    notifs.forEach(n => {\n      const l = h('div', 'ac-l ack.classList.add('show'))); hap(15);\n    await loadConfig(false); await loadAccountData(); markRead();\n  }\n  function closeAcct() { acctBack.classList.remove('show'); setTimeout(() => { if (!acctBack.classList.contains('show')) acctBack.hidden = true; }, 260); }\n  $('b-acct').addEventListener('click', openAcct);\n  $('acct-close').addEventListener('click', () => { hap(10); closeAcct(); });\n  acctBack.addEventListener('pointerdown', e => { if (e.target === acctBack) closeAcct(); });\n  document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (!acctBack.hidden) closeAcct(); else if (!opsBack.hidden) closeOps(); });\n  $('sw-avail').addEventListener('click', async () => {\n    const want = $('sw-avail').getAttribute('aria-checked') !== 'true'; hap(15);\n    const r = await sb.rpc('set_operator_availability', { p_accepting: want });\n    if (r.error) { console.error('set_operator_availability:', r.error); toast(errMsg(r.error), 3600); return; }\n    toast(want ? 'Ahora recibes operaciones.' : 'Pausaste las operaciones.', 1800); await loadConfig(false);\n  });\n  $('ac-wsave').addEventListener('click', async () => {\n    const w = $('ac-wallet').value.trim(); hap(15);\n    if (!/^0x[0-9a-fA-F]{40}$/.test(w)) { toast(ERR.invalid_wallet, 3200); return; }\n    const b = $('ac-wsave'); b.disabled = true;\n    try { const r = await sb.rpc('set_operator_payout_wallet', { p_wallet: w }); if (r.error) throw r.error; toast('Wallet guardada.', 1800); await loadConfig(false); }\n    catch (e) { console.error('set_operator_payout_wallet:', e); toast(errMsg(e), 3200); }\n    finally { b.disabled = false; }\n  });\n  $('ac-out').addEventListener('click', async () => { hap(15); try { await sb.auth.signOut(); } catch (e) {} leave(); });\n  window.suprenvFeedback = async msg => { const r = await sb.rpc('send_feedback', { p_message: msg }); if (r.error) console.error('send_feedback:', r.error); };\n\n\n  // ===== Primer ingreso: crear usuario y nombre antes de usar la app =====\n  const AUTO_USER = /^usr(_[0-9a-f]{6}\\d*)?$/;\n  const needsSetup = p => !String((p && p.full_name) || '').trim() || AUTO_USER.test(String((p && p.username) || ''));\n  function runOnboarding(sb, uid, prof, leave) {\n    return new Promise(resolve => {\n      const box = document.getElementById('ob-back'), u = document.getElementById('ob-user'), n = document.getElementById('ob-name');\n      const err = document.getElementById('ob-err'), btn = document.getElementById('ob-save');\n      u.value = AUTO_USER.test(prof.username || '') ? '' : (prof.username || '');\n      n.value = prof.full_name || '';\n      box.hidden = false;\n      const fail = m => { err.textContent = m; };\n      btn.onclick = async () => {\n        const user = u.value.trim().toLowerCase(), name = n.value.trim().replace(/\\s+/g, ' ');\n        if (!/^[a-z0-9_.-]{3,30}$/.test(user)) return fail('Usuario: de 3 a 30 caracteres (minúsculas, números, _ . -).');\n        if (AUTO_USER.test(user)) return fail('Elige un usuario que te identifique.');\n        if (name.length < 3 || name.indexOf(' ') < 0) return fail('Escribe tu nombre y apellido.');\n        btn.disabled = true; fail('');\n        try {\n          if (user !== (prof.username || '')) {\n            const a = await sb.rpc('username_available', { p_username: user });\n            if (a.error) throw a.error;\n            if (a.data === false) { fail('Ese usuario ya está en uso. Prueba otro.'); return; }\n          }\n          const r = await sb.from('profiles').update({ username: user, full_name: name }).eq('id', uid).select('id');\n          if (r.error) throw r.error;\n          if (!r.data || !r.data.length) throw new Error('no_rows');\n          prof.username = user; prof.full_name = name; box.hidden = true; resolve(true);\n        } catch (e) {\n          fail(e && e.code === '23505' ? 'Ese usuario ya está en uso. Prueba otro.' : 'No se pudo guardar. Revisa tu conexión e inténtalo otra vez.');\n        } finally { btn.disabled = false; }\n      };\n      document.getElementById('ob-out').onclick = async () => { try { await sb.auth.signOut(); } catch (e) {} leave(); };\n    });\n  }\n\n  let meP = {};\n  function fillPerfil() { if (document.activeElement !== $('ac-user')) $('ac-user').value = meP.username || ''; if (document.activeElement !== $('ac-name')) $('ac-name').value = meP.full_name || ''; }\n  $('ac-psave').addEventListener('click', async () => {\n    hap(15);\n    const user = $('ac-user').value.trim().toLowerCase(), name = $('ac-name').value.trim().replace(/\\s+/g, ' ');\n    if (!/^[a-z0-9_.-]{3,30}$/.test(user)) { toast('Usuario: de 3 a 30 caracteres (minúsculas, números, _ . -).', 3200); return; }\n    if (name.length < 3 || name.indexOf(' ') < 0) { toast('Escribe tu nombre y apellido.', 2600); return; }\n    const b = $('ac-psave'); b.disabled = true;\n    try {\n      if (user !== (meP.username || '')) {\n        const a = await sb.rpc('username_available', { p_username: user });\n        if (a.error) throw a.error;\n        if (a.data === false) { toast('Ese usuario ya está en uso.', 2600); return; }\n      }\n      const r = await sb.from('profiles').update({ username: user, full_name: name }).eq('id', uid).select('id');\n      if (r.error) throw r.error;\n      if (!r.data || !r.data.length) throw new Error('no_rows');\n      meP.username = user; meP.full_name = name; toast('Perfil guardado.', 1800);\n    } catch (e) { console.error('Guardar perfil:', e); toast(e && e.code === '23505' ? 'Ese usuario ya está en uso.' : 'No se pudo guardar el perfil.', 3000); }\n    finally { b.disabled = false; }\n  });\n\n  // ---------- Arranque ----------\n  (async function init() {\n    try {\n      const ses = await sb.auth.getSession();\n      if (!ses.data || !ses.data.session) { leave(); return; }\n      uid = ses.data.session.user.id;\n      const pr = await sb.from('profiles').select('username, full_name').eq('id', uid).maybeSingle();\n      meP = (pr && pr.data) || {};\n      if (needsSetup(meP)) await runOnboarding(sb, uid, meP, leave);\n      fillPerfil();\n      await loadMunis();\n      if (!(await loadConfig(true))) return;\n      await loadAccountData(); await pollAssign();\n      setInterval(pollAssign, 8000); setInterval(() => loadConfig(false), 30000); setInterval(loadMsgs, 15000);\n    } catch (e) { console.error('Inicio del gestor:', e); toast(errMsg(e), 3400); }\n  })();\n})();\n<\/script>\n\n<div id=\"ob-back\" class=\"ob-back\" hidden role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"ob-title\">\n  <div class=\"ob-box\">\n    <h2 id=\"ob-title\">Crea tu usuario<\/h2>\n    <p>Antes de continuar, elige tu usuario y escribe tu nombre. Así el administrador sabrá quién eres.<\/p>\n    <label for=\"ob-user\">Nombre de usuario<\/label>\n    <input class=\"base-in\" id=\"ob-user\" type=\"text\" autocomplete=\"off\" autocapitalize=\"none\" spellcheck=\"false\" placeholder=\"ej: juan.perez\">\n    <label for=\"ob-name\">Nombre y apellido<\/label>\n    <input class=\"base-in\" id=\"ob-name\" type=\"text\" autocomplete=\"off\" placeholder=\"Nombre y apellido\">\n    <div class=\"ob-err\" id=\"ob-err\" role=\"alert\"><\/div>\n    <button class=\"done\" id=\"ob-save\" type=\"button\">Guardar y continuar<\/button>\n    <button class=\"ob-out\" id=\"ob-out\" type=\"button\">Cerrar sesión<\/button>\n  <\/div>\n<\/div>\n<\/body>\n<\/html>\n";

  // ----- Ayudantes de cuenta -----
  const PENDING_KEY = 'suprenv_pending_operator_invitation';
  // La invitación pendiente se guarda junto al correo para canjearla solo con esa cuenta
  function readPending() { try { const v = JSON.parse(localStorage.getItem(PENDING_KEY) || 'null'); return v && v.email && v.code ? v : null; } catch (e) { return null; } }
  function writePending(email, code) { try { localStorage.setItem(PENDING_KEY, JSON.stringify({ email, code })); } catch (e) {} }
  function clearPending() { try { localStorage.removeItem(PENDING_KEY); } catch (e) {} }
  function parseRole(roleData) {
    let v = roleData;
    if (Array.isArray(v)) v = v.length ? v[0] : null;
    if (v && typeof v === 'object') v = v.role || v.get_my_role || null;
    return typeof v === 'string' ? v.trim().toLowerCase() : '';
  }
  function authMessage(error, fallback) {
    const raw = String((error && error.message) || '');

    if (code === 'user_already_exists' || /already (been )?registered|already exists/i.test(raw)) return 'Ese correo ya tiene una cuenta. Inicia sesión.';
    if (code === 'unexpected_failure' || /database error saving new user/i.test(raw)) return 'Supabase no pudo guardar el perfil del nuevo usuario (error de base de datos al crear la cuenta). Revisa los logs de Auth y Postgres del proyecto.';
    if (code === 'signup_disabled' || /signups? (not allowed|are disabled|disabled)/i.test(raw)) return 'El registro de cuentas está desactivado en Supabase.';
    if ((error && error.status === 429) || /rate limit|too many/i.test(raw)) return 'Demasiados intentos. Espera unos minutos e inténtalo de nuevo.';
    if (/password/i.test(raw) && /(weak|short|least|characters|contain)/i.test(raw)) return 'La contraseña no cumple los requisitos de Supabase: ' + raw;
    if (/invalid.*email|email.*invalid/i.test(raw)) return 'Supabase rechazó el correo. Revisa que esté bien escrito.';
    if (/failed to fetch|networkerror|network request/i.test(raw)) return 'Sin conexión con Supabase. Revisa tu internet.';
    return raw || fallback;
  }

  go.addEventListener('click', async () => {
    triggerHaptic(20);
    if (screen === 'request') { showView(3); return; }
    if (screen === 'register') {
      if (!supabaseClient) { toast('No se pudo cargar la conexión con Supabase. Revisa tu internet y reabre la app.', 3000); return; }
      const email = rUser.value.trim().toLowerCase();
      const password = rPass.value;
      const invitationCode = rRef.value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast('Escribe un correo electrónico válido.', 2400); return; }
      if (password.length < 8) { toast('La contraseña debe tener al menos 8 caracteres.', 2400); return; }
      if (acct.role === 'Gestor' && !invitationCode) { toast('Para crear una cuenta de gestor necesitas un código de invitación.', 2800); return; }
      const originalText = go.textContent;
      go.disabled = true; go.textContent = 'Creando cuenta…';
      try {
        // El rol no se envía: lo asigna el backend (client por defecto). El gestor solo canjea una invitación.
        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password,
          options: { data: { username: email.split('@')[0], full_name: '' } }
        });
        if (error) throw error;
        // Con confirmación de correo activa, un correo ya registrado responde "éxito" sin identidades: no es una cuenta nueva
        if (data && data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
          throw new Error('Ese correo ya tiene una cuenta. Inicia sesión.');
        }
        if (acct.role === 'Gestor') writePending(email, invitationCode);
        if (data && data.session) {
          // Comprueba que el backend creó el perfil y el rol; si no, no se anuncia un éxito falso
          const roleRes = await supabaseClient.rpc('get_my_role');
          if (roleRes.error || !parseRole(roleRes.data)) {
            console.error('Cuenta creada en Auth pero sin rol:', roleRes.error || roleRes.data);
            throw new Error('La cuenta se creó en Auth pero no tiene perfil o rol activo. Revisa el trigger de alta de usuarios en Supabase.');
          }
          if (acct.role === 'Gestor') {
            const { error: inviteError } = await supabaseClient.rpc('redeem_operator_invitation', { p_code: invitationCode });
            if (inviteError) { console.error('redeem_operator_invitation:', inviteError); throw new Error('La cuenta se creó, pero no se pudo aplicar la invitación: ' + inviteError.message); }
            clearPending();
          }
          toast('Cuenta creada. Ya puedes iniciar sesión.', 2800, () => goScreen('login'));
        } else {
          toast('Cuenta creada. Revisa tu correo para confirmar la cuenta. Después inicia sesión para activar el código de gestor, si corresponde.', 4500, () => goScreen('login'));
        }
      } catch (error) {
        toast(authMessage(error, 'No se pudo crear la cuenta.'), 4200);
      } finally {
        go.textContent = originalText; refresh();
      }
      return;
    }
    if (screen === 'login') {
      if (!supabaseClient) {
        toast('No se pudo cargar la conexión con Supabase. Revisa tu internet y reabre la app.', 3000);
        return;
      }
      const email = rUser.value.trim();
      const password = rPass.value;
      if (!email || !password) {
        toast('Escribe tu correo y contraseña.', 1800);
        return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        toast('Para iniciar sesión, escribe el correo de la cuenta.', 2200);
        return;
      }
      const originalText = go.textContent;
      go.disabled = true;
      go.textContent = 'Verificando…';
      try {
        const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (authError) throw authError;
        // Solo se canjea la invitación guardada para ESTA cuenta (evita aplicar el código de otra persona)
        const pending = readPending();
        if (pending && pending.email === email.toLowerCase()) {
          const { error: inviteError } = await supabaseClient.rpc('redeem_operator_invitation', { p_code: pending.code });
          if (inviteError) {
            console.error('redeem_operator_invitation:', inviteError);
            clearPending();
            await supabaseClient.auth.signOut();
            throw new Error('No se pudo activar la invitación de gestor: ' + inviteError.message + '. Pide un código nuevo; ya puedes entrar con tu cuenta.');
          }
          clearPending();
        }
        const { data: roleData, error: roleError } = await supabaseClient.rpc('get_my_role');
        if (roleError) {
          console.error('get_my_role:', roleError);
          await supabaseClient.auth.signOut();
          throw new Error('La contraseña fue aceptada, pero no se pudo consultar el rol. Revisa los permisos de get_my_role().');
        }
        const role = parseRole(roleData);
        if (!role) {
          await supabaseClient.auth.signOut();
          throw new Error('La cuenta inició sesión, pero no tiene un rol activo reconocido en SUPRENV.');
        }
        window.suprenvCurrentRole = role;
        window.suprenvCurrentUser = authData.user || null;
        const roleNames = {
          admin: 'ADMINISTRADOR',
          owner: 'PROPIETARIO',
          manager: 'GESTOR',
          gestor: 'GESTOR',
          operator: 'OPERADOR',
          client: 'USUARIO',
          usuario: 'USUARIO'
        };
        const roleName = roleNames[role] || role.toUpperCase();
        if (role === 'admin' || role === 'owner') {
          toast('Cuenta reconocida: ' + roleName, 1200, () => {
            const adminHost = document.getElementById('suprenv-admin-host');
            adminHost.srcdoc = SUPRENV_ADMIN_HTML;
            adminHost.style.display = 'block';
          });
        } else if (role === 'client' || role === 'usuario') {
          toast('Cuenta reconocida: ' + roleName, 1400, () => {
            const clientHost = document.getElementById('suprenv-client-host');
            clientHost.srcdoc = SUPRENV_CLIENT_HTML;
            clientHost.style.display = 'block';
          });
        } else if (role === 'operator' || role === 'gestor' || role === 'manager') {
          toast('Cuenta reconocida: ' + roleName, 1400, () => {
            const opHost = document.getElementById('suprenv-operator-host');
            opHost.srcdoc = SUPRENV_OPERATOR_HTML;
            opHost.style.display = 'block';
          });
        } else {
          toast('Cuenta reconocida: ' + roleName, 2600);
        }
      } catch (error) {
        const msg = error && error.message ? error.message : 'No se pudo iniciar sesión.';
        if (/invalid login credentials/i.test(msg)) { console.error('Login:', error); toast('Correo o contraseña incorrectos.', 2400); }
        else if (/email not confirmed/i.test(msg)) { console.error('Login:', error); toast('Debes confirmar el correo de la cuenta.', 2400); }
        else toast(authMessage(error, 'No se pudo iniciar sesión.'), 3600);
      } finally {
        go.textContent = originalText;
        refresh();
      }
    }

  });

  $('copiar-btn').addEventListener('click', function () {
    const input = $('wallet-input');
    const text = input.value.trim();
    if (!text) { input.focus(); return; }
    triggerHaptic(15);
    const btn = this;
    const done = () => {
      btn.textContent = '¡Copiado!';
      btn.style.background = 'linear-gradient(180deg, #86F7E3, var(--green-2))';
      btn.style.color = '#022019';
      setTimeout(() => { btn.textContent = 'Copiar'; btn.style.background = ''; btn.style.color = ''; }, 1300);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(() => {});
    else { input.select(); try { document.execCommand('copy'); } catch (e) {} done(); }
  });

  $('check-btn').addEventListener('click', () => {
    triggerHaptic(20);
    const info = {
      destino: state.prov, montoUsdt: state.usdt, monedaEntrega: state.cur,
      repartoCalle: $('a-calle').value, edificioCasa: $('a-edif').value, ciCp: $('a-ci').value, telefono: $('a-tel').value,
      wallet: $('wallet-input').value, hash: $('hash-input').value, timestamp: new Date().toISOString()
    };

  const acctBox = $('view-acct'), rUser = $('r-user'), rPass = $('r-pass'), rPass2 = $('r-pass2');
  const roleBtns = Array.from(document.querySelectorAll('.roles .city'));
  const acct = { role: null };
  const refRow = $('ref-row'), rRef = $('r-ref'), seg = $('seg'), saveBtn = $('save-btn');
  const titleEl = $('title');

  function refresh() {
    if (screen === 'request') return refreshRequest();
    if (screen === 'welcome') { go.disabled = true; return; }
    const reg = screen === 'register';
    const userLabel = $('r-user-label');
    if (userLabel) userLabel.textContent = 'Correo electrónico';
    rUser.type = 'email';
    rUser.placeholder = 'tu@correo.com';
    rUser.autocomplete = reg ? 'email' : 'email';
    const mismatch = reg && rPass2.value.length > 0 && rPass.value !== rPass2.value;
    if (mismatch) { confirmBox.hidden = false; confirmBox.textContent = 'Las contraseñas no coinciden.'; confirmBox.dataset.k = 'mismatch'; }
    else if (confirmBox.dataset.k === 'mismatch') { confirmBox.hidden = true; confirmBox.dataset.k = ''; }
    const validEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(rUser.value.trim());
    go.disabled = reg ? !(validEmail && rPass.value.length >= 8 && rPass.value === rPass2.value && acct.role && (acct.role !== 'Gestor' || rRef.value.trim()))
                      : !(validEmail && rPass.value);
    roleBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.role === acct.role)));
    seg.dataset.role = acct.role || 'Usuario';
    saveBtn.disabled = go.disabled;                 // Guardar se activa en las mismas condiciones que Continuar
    refRow.hidden = acct.role !== 'Gestor';          // el código de referido solo aparece con Gestor
    if (refRow.hidden) rRef.value = '';
  }
  function goScreen(n) {
    screen = n;
    const isAcct = n === 'login' || n === 'register';
    $('welcome').hidden = n !== 'welcome';
    $('card').hidden = n === 'welcome';
    acctBox.classList.toggle('hidden', !isAcct);
    acctBox.dataset.mode = isAcct ? n : 'register';
    if (n === 'request') showView(1);
    else { view1.classList.add('hidden'); view3.classList.add('hidden'); view4.classList.add('hidden'); }
    titleEl.textContent = n === 'welcome' ? 'Haz tu mensajería con nosotros' : 'Solicita tu mensajería';
    titleEl.classList.toggle('tag', n === 'welcome');
    $('back').hidden = !isAcct;
    if (isAcct) {
      rUser.value = rPass.value = rPass2.value = ''; acct.role = 'Usuario';
      rPass.autocomplete = n === 'login' ? 'current-password' : 'new-password';
    }
    confirmBox.hidden = true; confirmBox.dataset.k = '';
    window.scrollTo({ top: 0 });
    refresh();
  }
  $('w-login').addEventListener('click', () => { triggerHaptic(15); goScreen('login'); });
  $('w-reg').addEventListener('click', () => { triggerHaptic(15); goScreen('register'); });

  [rUser, rPass, rPass2, rRef].forEach(el => el.addEventListener('input', refresh));
  saveBtn.addEventListener('click', () => { if (!saveBtn.disabled) go.click(); });   // guarda la cuenta (igual que Continuar)
  roleBtns.forEach(b => b.addEventListener('click', () => { triggerHaptic(15); acct.role = b.dataset.role; refresh(); }));
  // Link de referido: ?gestor=CODIGO abre "Crear cuenta" como Gestor con el código ya escrito
  (function () {
    let code = '';
    try { code = (new URLSearchParams(location.search).get('gestor') || '').trim(); } catch (e) {}
    if (!code) return;
    goScreen('register');
    acct.role = 'Gestor'; rRef.value = code.toUpperCase(); refresh();
  })();

  // Burbujas de feedback y ajustes
  const sheets = { fb: $('sheet-feedback'), set: $('sheet-settings') };
  const btns = { fb: $('b-fb'), set: $('b-set') };
  function toggle(k) {
    Object.keys(sheets).forEach(j => {
      const open = j === k && sheets[j].hidden;
      sheets[j].hidden = !open;
      btns[j].setAttribute('aria-expanded', String(open));
    });
  }
  btns.fb.addEventListener('click', () => toggle('fb'));
  btns.set.addEventListener('click', () => toggle('set'));
  // Tocar fuera de una ventana abierta (feedback o ajustes) la cierra
  document.addEventListener('pointerdown', e => {
    if (e.target.closest('.sheet, #b-fb, #b-set')) return;
    Object.keys(sheets).forEach(j => { if (!sheets[j].hidden) { sheets[j].hidden = true; btns[j].setAttribute('aria-expanded', 'false'); } });
  });
  $('fbsend').addEventListener('click', () => {
    const t = $('fb');
    if (!t.value.trim()) { t.focus(); return; }
    t.value = ''; toggle('fb');

  document.querySelectorAll('.switch').forEach(sw => sw.addEventListener('click', () =>
