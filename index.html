<title>Solicita tu mensajería</title>
<style>
  /* ===== Estilo "Mensajero": azul marino oscuro, vidrio plano, botones físicos que se hunden ===== */
  :root {
    color-scheme: dark;
    --h: 46px;          /* alto de botones/campos */
    --gap: 8px;
    --pad: 8px;

    /* Color base */
    --bg: #050b1c;
    --green: #7ea3ff;                  /* acento de foco (nombre heredado; es azul) */
    --text: #ffffff;
    --ink-soft: rgba(255,255,255,.60);

    /* Bordes de vidrio: arriba, derecha, abajo, izquierda */
    --g-edge:      rgba(150,180,255,.40) rgba(150,180,255,.13) rgba(150,180,255,.09) rgba(150,180,255,.24);
    --g-edge-sunk: rgba(0,0,0,.45) rgba(150,180,255,.16) rgba(150,180,255,.24) rgba(0,0,0,.35);
    --g-hair: rgba(0,0,0,.55);

    /* Sombras */
    --g-ledge: rgba(0,0,0,.50);
    --g-drop:  rgba(0,0,0,.55);
    --g-insh:  rgba(0,0,0,.55);

    /* Botón normal (reposo) y hundido */
    --key: rgba(24,30,52,.90);
    --p-top: #030816;  --p-bot: #060e22;

    /* Botón de acción principal */
    --g-ac-top: #3566d6;  --g-ac-mid: #2d58c0;  --g-ac-bot: #2650ab;  --g-ac-txt: #ffffff;
    --g-acp-top: #1a3f8c; --g-acp-bot: #204a9f;

    /* Marcos de vidrio */
    --f-top: rgba(150,180,255,.026); --f-mid: rgba(150,180,255,.007); --f-bot: rgba(150,180,255,.018);

    /* Hoja/modal */
    --s-top: #0d1a38; --s-bot: #08122a;

    /* Campos hundidos */
    --w-top: rgba(0,0,0,.55); --w-bot: rgba(150,180,255,.04);

    --g-ts: 0 1px 2px rgba(0,0,0,.6);

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (max-height: 720px) { :root { --h: 42px; } }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background-color: var(--bg); background-image: none;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-shadow: 0 1px 3px rgba(0,25,24,.55), 0 0 1px rgba(0,25,24,.35);
  }
  button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }

  .screen { position: relative; max-width: 430px; margin: 0 auto; min-height: 100vh; padding-bottom: 88px; overflow: hidden;
            padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }

  /* Logo y bolitas: capa aparte, fija y sin respuesta al toque */
  .orbit { position: relative; height: 186px; margin-top: 0; }
  .planet { position: fixed; left: 0; top: 0; z-index: 1; pointer-events: none; will-change: transform; }
  .logo-main { position: absolute; left: 50%; top: 50%; width: 108px; height: 108px; transform: translate(-50%, -50%); }

  /* Estiramiento elástico de la interfaz (las bolas no se tocan) */
  .card { transform: translate(var(--ctx, 0px), var(--cty, 0px)) scale(var(--csx, 1), var(--csy, 1)); touch-action: none; }
  .city, .fieldbtn, .go, .done { transform: scale(var(--bsx, 1), var(--bsy, 1)); }

  /* ---- Marcos de vidrio: tarjeta, panel, hoja, aviso ---- */
  .card, .panel, .sheet, .toast-notification {
    border: 1.5px solid; border-color: var(--g-edge);
    background: linear-gradient(180deg, var(--f-top) 0%, var(--f-mid) 55%, var(--f-bot) 100%);
    -webkit-backdrop-filter: blur(2px) saturate(120%); backdrop-filter: blur(2px) saturate(120%);
    box-shadow:
      inset 0 1px 0 rgba(170,200,255,.16),
      inset 0 -1px 0 rgba(170,200,255,.04),
      0 0 0 1px var(--g-hair),
      0 18px 30px -14px var(--g-drop);
  }
  .card  { position: relative; z-index: 2; border-radius: 26px; margin: 0 24px; padding: 14px 12px; }
  .panel { position: relative; border-radius: 20px; padding: var(--pad); display: flex; flex-direction: column; gap: var(--gap); min-height: 196px; }
  .sheet { position: fixed; left: 50%; transform: translateX(-50%); z-index: 4;
           width: min(100% - 28px, 402px); bottom: calc(90px + env(safe-area-inset-bottom, 0px));
           border-radius: 22px; padding: 18px; background: linear-gradient(180deg, var(--s-top), var(--s-bot));
           -webkit-backdrop-filter: blur(10px) saturate(130%); backdrop-filter: blur(10px) saturate(130%); }
  .sheet[hidden] { display: none; }
  @media (max-width: 379px) { .card { margin: 0 16px; padding: 12px 8px; } }

  /* Título / cartel */
  .title {
    position: relative; z-index: 2; width: auto; max-width: 90%; margin: -6px auto 14px; padding: 0;
    border: 0; background: none; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; border-radius: 0;
    text-align: center; text-transform: uppercase; font-weight: 800; letter-spacing: .06em;
    font-size: clamp(13px, 3.7vw, 16px); line-height: 1.22; text-wrap: balance; color: var(--text); pointer-events: none;
  }

  .grid { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: 10px; align-items: center; }
  @media (max-width: 379px) { .grid { grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); gap: 6px; } }

  /* Campos de la izquierda (botones que abren el panel) */
  .fields { display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; align-self: center; margin: 0; }

  .panel [data-for] { display: none; flex-direction: column; gap: var(--gap); }
  .panel[data-view="idle"] [data-for="idle"],
  .panel[data-view="prov"] [data-for="prov"],
  .panel[data-view="addr"] [data-for="addr"],
  .panel[data-view="monto"] [data-for="monto"] { display: flex; }
  .panel[data-view="prov"] { padding-bottom: var(--pad); }
  .panel[data-view="addr"] { padding-bottom: calc(var(--pad) + 4px); }
  .hint { margin: auto; padding: 8px; text-align: center; font-size: 15px; line-height: 1.35; color: var(--ink-soft); }

  /* ---- BOTONES: teclas físicas que se hunden ---- */
  .city, .fieldbtn, .bubble, .go, .done, .sheet .send, .copiar-btn, .check-btn {
    position: relative; top: 0; isolation: isolate; cursor: pointer;
    height: var(--h); border-radius: 14px; padding: 0 12px;
    font-size: 16px; font-weight: 700; text-align: center; color: var(--text); text-shadow: var(--g-ts);
    border: 1.5px solid rgba(255,255,255,.16);
    background: var(--key);
    -webkit-backdrop-filter: none; backdrop-filter: none;
    box-shadow: 0 3px 0 rgba(0,0,0,.55), 0 8px 12px -6px rgba(0,0,0,.55);
    transition: top .08s ease-out, box-shadow .08s ease-out, background .18s, border-color .18s, transform .15s ease-out;
  }
  .city::before, .city::after, .fieldbtn::before, .fieldbtn::after, .bubble::before, .bubble::after,
  .go::before, .go::after, .done::before, .done::after { opacity: 0; }

  /* Hundido / pulsado / seleccionado */
  .city:active, .city.is-pressed, .city[aria-pressed="true"],
  .fieldbtn:active, .fieldbtn.is-pressed, .fieldbtn[aria-expanded="true"],
  .bubble:active, .bubble.is-pressed, .bubble[aria-expanded="true"],
  .copiar-btn:active, .copiar-btn.is-pressed {
    top: 3px;
    border-color: var(--g-edge-sunk);
    background: linear-gradient(180deg, var(--p-top) 0%, var(--p-bot) 100%);
    box-shadow: inset 0 3px 6px rgba(0,0,0,.55), inset 0 -1px 0 rgba(255,255,255,.28), 0 0 0 1px rgba(0,0,0,.55);
    outline: none;
  }
  .bubble:active, .bubble.is-pressed, .bubble[aria-expanded="true"] { top: 4px; }

  /* Campos-botón de la izquierda */
  .fieldbtn { width: 100%; max-width: 148px; font-size: clamp(13px, 3.5vw, 16px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fieldbtn.empty { color: var(--ink-soft); font-weight: 600; }
  .fieldbtn[aria-expanded="true"] { color: var(--text); }

  /* Burbujas de icono: cuadrado redondeado */
  .bubble { flex: none; width: 62px; height: 62px; border-radius: 18px; padding: 0; display: grid; place-items: center; }
  .bubble svg { width: 28px; height: 28px; filter: none; }

  /* Teclas de las listas */
  .city { width: 100%; }
  .cur-row .city { font-size: 15px; padding: 0 8px; }

  /* Botón de acción principal */
  .go, .done, .sheet .send, .check-btn { font-size: 16px; }
  .go:not(:disabled), .done, .sheet .send, .check-btn {
    color: var(--g-ac-txt);
    background: linear-gradient(180deg, var(--g-ac-top) 0%, var(--g-ac-bot) 100%);
    border-color: rgba(255,255,255,.20);
    box-shadow: 0 3px 0 rgba(0,0,0,.50), 0 8px 12px -6px rgba(0,0,0,.55);
    text-shadow: 0 1px 2px rgba(0,0,0,.45);
  }
  .go:not(:disabled):active, .go.is-pressed:not(:disabled),
  .done:active, .done.is-pressed, .sheet .send:active, .sheet .send.is-pressed,
  .check-btn:active, .check-btn.is-pressed {
    top: 3px; border-color: var(--g-edge-sunk);
    background: linear-gradient(180deg, var(--g-acp-top) 0%, var(--g-acp-bot) 100%);
    box-shadow: inset 0 3px 6px rgba(0,0,0,.45), inset 0 -1px 0 rgba(255,255,255,.2), 0 0 0 1px var(--g-hair);
  }
  .go { width: 100%; height: 48px; font-size: 18px; color: var(--ink-soft); cursor: not-allowed; }
  .go:not(:disabled) { cursor: pointer; }
  .go:disabled { color: var(--ink-soft); cursor: not-allowed; opacity: 1; }
  .done { align-self: flex-end; height: 44px; padding: 0 22px; }
  .sheet .send { margin-top: 10px; width: 100%; height: 46px; font-size: 17px; }

  .city:focus-visible, .go:focus-visible, .done:focus-visible, .bubble:focus-visible, .fieldbtn:focus-visible,
  .copiar-btn:focus-visible, .check-btn:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }

  .pdiv { height: 2px; margin: 2px 4px; border-radius: 2px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); flex: none; }

  /* ---- Campos de texto: huecos hundidos ---- */
  .base-in, .input-field, .sheet textarea {
    width: 100%; height: var(--h); padding: 0 16px; font-size: 15px; color: var(--text); outline: none; text-align: left;
    border: 1.5px solid; border-color: var(--g-edge-sunk); border-radius: 12px;
    background: linear-gradient(180deg, var(--w-top) 0%, var(--w-bot) 100%);
    -webkit-backdrop-filter: none; backdrop-filter: none;
    box-shadow: inset 0 3px 6px var(--g-insh), inset 0 -1px 0 rgba(255,255,255,.3), 0 0 0 1px var(--g-hair);
    transition: border-color .2s, box-shadow .2s;
  }
  .base-in::placeholder, .input-field::placeholder, .sheet textarea::placeholder { color: rgba(255,255,255,.62); opacity: 1; }
  .base-in:focus, .input-field:focus, .sheet textarea:focus {
    border-color: #7ea3ff;
    box-shadow: inset 0 3px 6px var(--g-insh), inset 0 -1px 0 rgba(255,255,255,.3), 0 0 0 2px rgba(255,255,255,.35);
  }
  .input-field { font-weight: 600; margin-bottom: 10px; }
  .sheet textarea { min-height: 90px; height: auto; padding: 12px 16px; resize: none; font: inherit; font-size: 16px; }

  /* Monto */
  .cur { text-align: center; font-size: 22px; font-weight: 800; letter-spacing: .02em; margin-top: 4px; }
  .cur-row { display: grid; grid-template-columns: 46px 1fr; align-items: center; gap: 6px; }
  .cur-row > span { font-size: 17px; font-weight: 800; color: var(--text); }
  .cur-row .base-in { padding: 0 14px; }
  .panel .base-in { font-size: 14px; padding: 0 12px; }
  .cur-note { text-align: center; font-size: 13px; font-weight: 700; color: var(--text); }

  .confirm { margin-top: 14px; padding: 13px 16px; border-radius: 22px; font-size: 15px; line-height: 1.35; color: var(--text);
             background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.5); box-shadow: 0 0 18px rgba(255,255,255,.25); }
  .confirm[hidden] { display: none; }

  /* Fila inferior fija */
  .bottom {
    position: fixed; left: 50%; transform: translateX(-50%);
    width: min(100%, 430px); padding: 0 14px;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; gap: 10px; z-index: 5;
  }
  .bar { flex: 1; min-width: 0; padding: 0; border: 0; background: none; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }

  /* Hojas */
  .sheet h2 { margin: 0 0 12px; font-size: 19px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 8px 2px; font-size: 17px; }

  /* Interruptor */
  .switch {
    position: relative; width: 52px; height: 30px; padding: 0; border-radius: 10px; cursor: pointer;
    border: 1.5px solid; border-color: var(--g-edge-sunk);
    background: linear-gradient(180deg, var(--w-top), var(--w-bot));
    box-shadow: inset 0 2px 5px var(--g-insh), 0 0 0 1px var(--g-hair);
    transition: background .2s, box-shadow .2s;
  }
  .switch::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 7px;
    border: 1px solid; border-color: var(--g-edge);
    background: linear-gradient(180deg, #f4f7ff, #bccaee);
    box-shadow: 0 2px 0 var(--g-ledge), 0 4px 6px -2px var(--g-drop);
    transition: transform .18s ease-out, top .08s ease-out, box-shadow .08s ease-out;
  }
  .switch:active::after { top: 4px; box-shadow: 0 1px 0 var(--g-ledge); }
  .switch[aria-checked="true"] { background: linear-gradient(180deg, var(--g-ac-top), var(--g-ac-bot)); }
  .switch[aria-checked="true"]::after { transform: translateX(21px); }
  .switch:focus-visible { outline: 2px solid rgba(255,255,255,.7); outline-offset: 2px; }

  /* Aviso emergente */
  .toast-notification {
    position: fixed; bottom: 100px; left: 50%; z-index: 1000; max-width: calc(100% - 40px);
    transform: translateX(-50%) translateY(20px); opacity: 0; visibility: hidden; text-align: center;
    padding: 13px 28px; border-radius: 16px; border-width: 1.5px;
    font-size: 15px; font-weight: 800; letter-spacing: .03em; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5);
    background: linear-gradient(180deg, var(--g-ac-top) 0%, var(--g-ac-bot) 100%);
    transition: all .3s cubic-bezier(.34, 1.56, .64, 1);
  }
  .toast-notification.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

  /* Pie */
  footer.below {
    position: relative; z-index: 2; display: block; margin: 14px auto 0; width: auto; max-width: 90%; height: auto; padding: 0; text-align: center;
    border: 0; border-radius: 0; background: none; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none;
    font-size: 10.5px; line-height: 1.2; font-weight: 700; letter-spacing: .06em; white-space: nowrap; pointer-events: none;
    color: rgba(255,255,255,.55); text-shadow: 0 1px 2px rgba(0,25,24,.5);
  }

  /* ===== Vistas 3 y 4: Wallet/Hash y estado de mensajería ===== */
  .app-view { display: flex; flex-direction: column; width: 100%; }
  .app-view.hidden, .grid.hidden { display: none; }
  .divider { width: 100%; height: 2px; margin: 10px 0; border-radius: 2px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); }
  .black-pill {
    width: 105px; height: 38px; display: flex; align-items: center; justify-content: center; text-align: center;
    border-radius: 12px; font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 6px;
    border: 1.5px solid; border-color: var(--g-edge);
    background: linear-gradient(180deg, var(--f-top), var(--f-bot)), rgba(150,180,255,.06);
    box-shadow: inset 0 1px 0 rgba(170,200,255,.16), 0 0 0 1px var(--g-hair);
  }
  .copiar-container, .check-container { display: flex; justify-content: flex-end; }
  .copiar-container { margin: 2px 0 10px 0; }
  .check-container { margin-top: 4px; }
  .copiar-btn { height: auto; padding: 8px 22px; font-size: 13px; }
  .check-btn { width: 48px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  /* ===== Inicio de sesión: bienvenida, cuenta y navegación (estilo Mensajero) ===== */
  .screen { display: flex; flex-direction: column; padding-bottom: 80px; }
  .orbit { flex: none; height: 190px; margin-top: 4px; }
  .title-row { position: relative; z-index: 2; flex: none; display: flex; justify-content: center; margin: -6px 0 12px; }
  .title-row .title { margin: 0; }
  .title.tag { text-transform: none; font-size: 17px; font-weight: 800; letter-spacing: .03em; padding: 4px 0; max-width: 90%; }
  .back.bubble { position: absolute; left: 8px; top: 0; bottom: 0; margin: auto 0; width: 38px; height: 38px; border-radius: 12px; z-index: 3; }
  .back.bubble svg { width: 20px; height: 20px; }
  .back.bubble:active, .back.bubble.is-pressed { top: 0; transform: translateY(3px); }
  .back[hidden], .welcome[hidden], .card[hidden] { display: none; }

  .welcome { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 28px 0 0; position: relative; z-index: 2; }
  .welcome-note { margin: -24px 0 24px; text-align: center; font-size: 13px; font-weight: 600; letter-spacing: .02em; color: var(--ink-soft); text-shadow: var(--g-ts); }
  .welcome .city { width: 200px; font-size: 17px; }
  .or { font-size: 20px; font-weight: 900; line-height: 1; color: var(--text); text-shadow: var(--g-ts); }
  .need { margin: 20px 28px 0; text-align: center; font-size: 19px; font-weight: 900; line-height: 1.22; color: var(--text); text-shadow: var(--g-ts); }

  .reg { gap: 9px; padding: 0 4px; }
  .reg-row { display: flex; align-items: center; gap: 12px; }
  .reg-row[hidden] { display: none; }
  .reg-label { flex: 0 1 auto; min-width: 0; max-width: 6.3em; font-size: 17px; font-weight: 800; letter-spacing: -.01em; line-height: 1.1;
    color: var(--text); text-shadow: var(--g-ts); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reg-field { flex: 1 1 0; width: auto; min-width: 0; height: 43px; border-radius: 12px; font-size: 15px; padding: 0 14px; margin-bottom: 0; }
  .reg .divider { margin: 2px 0 0; }
  .roles { display: flex; align-items: center; gap: 8px; padding: 0 2px 5px; }
  .roles .done { flex: none; align-self: auto; height: 46px; padding: 0 20px; font-size: 16px; }
  .done:disabled { color: var(--ink-soft); cursor: not-allowed; background: var(--key); border-color: rgba(255,255,255,.16); box-shadow: 0 3px 0 rgba(0,0,0,.55), 0 8px 12px -6px rgba(0,0,0,.55); text-shadow: var(--g-ts); }

  /* Interruptor Usuario / Gestor (estilo iOS): la pastilla azul se desliza de izquierda a derecha */
  .seg { position: relative; flex: 1; min-width: 0; height: 46px; padding: 3px; display: grid; grid-template-columns: 1fr 1fr; border-radius: 14px;
         border: 1.5px solid; border-color: var(--g-edge-sunk);
         background: linear-gradient(180deg, var(--w-top), var(--w-bot));
         box-shadow: inset 0 3px 6px var(--g-insh), 0 0 0 1px var(--g-hair); }
  .seg-thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); z-index: 0; border-radius: 11px;
               border: 1px solid rgba(255,255,255,.20);
               background: linear-gradient(180deg, var(--g-ac-top) 0%, var(--g-ac-bot) 100%);
               box-shadow: 0 2px 0 rgba(0,0,0,.50), 0 4px 6px -2px rgba(0,0,0,.55);
               transition: transform .22s cubic-bezier(.34, 1.3, .64, 1); }
  .seg[data-role="Gestor"] .seg-thumb { transform: translateX(100%); }
  .seg .city, .seg .city:active, .seg .city.is-pressed, .seg .city[aria-pressed="true"] {
    z-index: 1; top: 0; height: 100%; padding: 0 6px; font-size: 15px; border: 0; border-radius: 11px; background: none; box-shadow: none;
    color: var(--ink-soft); text-shadow: var(--g-ts); }
  .seg .city[aria-pressed="true"] { color: #fff; }
  #view-acct[data-mode="login"] [data-only="register"] { display: none; }
  #view-acct[data-mode="login"] { padding-bottom: 6px; }

  /* Lista de provincias: scroll interno para que quepan las 16 sin estirar la tarjeta */
  .panel [data-for="prov"] { max-height: 310px; overflow-y: auto; overflow-x: hidden; padding: 2px 6px 16px; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .panel [data-for="prov"]::-webkit-scrollbar { display: none; }
  .panel [data-for="prov"] .city { flex: none; white-space: nowrap; padding: 0 8px; font-size: 15px; }
  .panel [data-for="prov"] .city.long { font-size: 12.5px; }

  /* Estado de mensajería: teclas que se eligen */
  #view-4 { gap: 12px; }
  .status-card {
    position: relative; top: 0; width: 100%; height: 52px; padding: 0 20px; display: flex; align-items: center; cursor: pointer;
    border-radius: 14px; font-size: 15px; font-weight: 700; color: var(--text); text-shadow: var(--g-ts);
    border: 1.5px solid rgba(255,255,255,.16); background: var(--key);
    box-shadow: 0 3px 0 rgba(0,0,0,.55), 0 8px 12px -6px rgba(0,0,0,.55);
    transition: top .08s ease-out, box-shadow .08s ease-out, background .18s, border-color .18s;
    -webkit-tap-highlight-color: transparent;
  }
  .status-card:active, .status-card.is-pressed {
    top: 3px; border-color: var(--g-edge-sunk);
    background: linear-gradient(180deg, var(--p-top) 0%, var(--p-bot) 100%);
    box-shadow: inset 0 3px 6px rgba(0,0,0,.55), inset 0 -1px 0 rgba(255,255,255,.28), 0 0 0 1px rgba(0,0,0,.55);
  }
  .status-card.selected {
    color: var(--g-ac-txt); border-color: rgba(255,255,255,.20);
    background: linear-gradient(180deg, var(--g-ac-top) 0%, var(--g-ac-bot) 100%);
    box-shadow: 0 3px 0 rgba(0,0,0,.50), 0 8px 12px -6px rgba(0,0,0,.55);
    text-shadow: 0 1px 2px rgba(0,0,0,.45);
  }
  .status-card:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }

  /* El botón "Copiar" confirma con un color en línea desde el script: lo llevamos al azul de acción */
  .copiar-btn[style] { background: linear-gradient(180deg, var(--g-ac-top), var(--g-ac-bot)) !important; color: var(--g-ac-txt) !important; }

  /* Crédito centrado en el margen entre el cuadro principal y la barra de abajo */
  footer.below { margin: auto; padding: 12px 0; }

  /* ===== Logo de vidrio tallado (forma irregular original): grande y bolitas ===== */
  .glass-logo { --u: 1; }
  .logo-main.glass-logo { --u: .818; }
  .glass-logo i, .glass-logo .spin { position: absolute; inset: 0; display: block; pointer-events: none; }
  .glass-logo i.gl-under, .glass-logo i.gl-under2, .glass-logo i.gl-rim { bottom: -10.625%; }

  /* ===== Modo oscuro (Ajustes): misma familia azul, aún más profunda ===== */

<main class="screen">

  <div class="orbit" id="orbit" role="img" aria-label="Logo SupreNv"><div class="logo-main glass-logo"><i class="gl-under"></i><i class="gl-under2"></i><i class="gl-rim"></i><div class="spin"><i class="gl-edge"></i><i class="gl-face"></i><i class="carve hi"></i><i class="carve sh"></i><i class="carve in"></i></div></div></div>

  <div class="title-row">
    <button class="back bubble" id="back" type="button" aria-label="Volver" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="title tag" id="title">Haz tu mensajería con nosotros</div>
  </div>

  <!-- PANTALLA DE BIENVENIDA -->
  <div class="welcome" id="welcome">
    <p class="welcome-note">Crea tu cuenta para continuar</p>
    <button class="city" id="w-login" type="button">Iniciar sesión</button>
    <div class="or">O</div>
    <button class="city" id="w-reg" type="button">Crear cuenta</button>
  </div>

  <section class="card" id="card" aria-label="Solicitud de mensajería" hidden>
    <!-- CUENTA: crear cuenta (con confirmar y rol) o iniciar sesión (solo usuario y contraseña) -->
    <div id="view-acct" class="app-view reg hidden" data-mode="register">
      <div class="reg-row">
        <label class="reg-label" id="r-user-label" for="r-user">Usuario</label>
        <input class="base-in reg-field" id="r-user" type="text" placeholder="Tu usuario" autocomplete="username" autocapitalize="none" spellcheck="false">
      </div>
      <div class="reg-row">
        <label class="reg-label" for="r-pass">Contraseña</label>
        <input class="base-in reg-field" id="r-pass" type="password" placeholder="Contraseña (mínimo 8 caracteres)" autocomplete="new-password">
      </div>
      <div class="reg-row" data-only="register">
        <label class="reg-label" for="r-pass2" title="Confirmar contraseña">Confirmar contraseña</label>
        <input class="base-in reg-field" id="r-pass2" type="password" placeholder="••••••" autocomplete="new-password" aria-label="Confirmar contraseña">
      </div>
      <div class="divider" data-only="register"></div>
      <div class="roles" data-only="register" role="group" aria-label="Tipo de cuenta">
        <div class="seg" id="seg" data-role="Usuario">
          <span class="seg-thumb" aria-hidden="true"></span>
          <button class="city" type="button" aria-pressed="true" data-role="Usuario">Usuario</button>
          <button class="city" type="button" aria-pressed="false" data-role="Gestor">Gestor</button>
        </div>
        <button class="done" id="save-btn" type="button" disabled>Guardar</button>
      </div>
      <div class="reg-row" id="ref-row" data-only="register" hidden>
        <input class="base-in reg-field" id="r-ref" type="text" placeholder="Código de referido" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Código de referido">
      </div>
    </div>

    <div class="grid" id="view-1">

      <div class="fields">
        <button id="f-destino" class="fieldbtn empty" type="button" aria-expanded="false" aria-controls="panel">Destino</button>
        <button id="f-monto" class="fieldbtn empty" type="button" aria-expanded="false" aria-controls="panel">Monto</button>
      </div>

      <div id="panel" class="panel" data-view="idle">

        <div data-for="idle"><p class="hint">Toca Destino o Monto para elegir</p></div>

        <div data-for="prov" role="group" aria-label="Provincias">
          <button class="city" type="button" aria-pressed="false">Santiago</button>
          <button class="city" type="button" aria-pressed="false">Holguín</button>
          <button class="city" type="button" aria-pressed="false">La Habana</button>
          <button class="city" type="button" aria-pressed="false">Las Tunas</button>
          <button class="city" type="button" aria-pressed="false">Pinar del Río</button>
          <button class="city" type="button" aria-pressed="false">Artemisa</button>
          <button class="city" type="button" aria-pressed="false">Mayabeque</button>
          <button class="city" type="button" aria-pressed="false">Matanzas</button>
          <button class="city" type="button" aria-pressed="false">Cienfuegos</button>
          <button class="city" type="button" aria-pressed="false">Villa Clara</button>
          <button class="city" type="button" aria-pressed="false">Sancti Spíritus</button>
          <button class="city" type="button" aria-pressed="false">Ciego de Ávila</button>
          <button class="city" type="button" aria-pressed="false">Camagüey</button>
          <button class="city" type="button" aria-pressed="false">Granma</button>
          <button class="city" type="button" aria-pressed="false">Guantánamo</button>
          <button class="city long" type="button" aria-pressed="false">Isla de la Juventud</button>
        </div>

        <div data-for="addr">
          <button id="addr-prov" class="city" type="button" aria-pressed="true" title="Cambiar provincia"></button>
          <div class="pdiv"></div>
          <input class="base-in" id="a-calle" type="text" placeholder="Reparto y Calle" autocomplete="off" aria-label="Reparto y calle">
          <input class="base-in" id="a-edif" type="text" placeholder="Edificio, No. casa" autocomplete="off" aria-label="Edificio, número de casa">
          <input class="base-in" id="a-ci" type="text" placeholder="C.I, C.P" autocomplete="off" aria-label="Carnet de identidad, código postal">
          <input class="base-in" id="a-tel" type="tel" placeholder="Teléfono" autocomplete="off" aria-label="Teléfono">
          <button id="addr-done" class="done" type="button">Hecho</button>
        </div>

        <div data-for="monto">
          <div class="cur">USDT</div>
          <input class="base-in" id="m-usdt" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off" aria-label="Monto en USDT">
          <div class="pdiv"></div>
          <div class="cur-note">Entregar en:</div>
          <div class="cur-row"><span>USD</span><button class="city" id="c-usd" type="button" aria-pressed="false">Elegir</button></div>
          <div class="cur-row"><span>CUP</span><button class="city" id="c-cup" type="button" aria-pressed="false">Elegir</button></div>
        </div>

      </div>
    </div>
    <div id="confirm" class="confirm" role="status" hidden></div>

    <!-- VISTA 3: Wallet y Hash (sale al dar Continuar) -->
    <div id="view-3" class="app-view hidden">
      <div>
        <div class="black-pill">Wallet</div>
        <input type="text" id="wallet-input" class="input-field" placeholder="Ingresa o pega la wallet..." autocomplete="off">
      </div>
      <div class="copiar-container">
        <button class="copiar-btn" id="copiar-btn" type="button">Copiar</button>
      </div>
      <div>
        <div class="black-pill">Hash</div>
        <input type="text" id="hash-input" class="input-field" placeholder="Ingresa el hash..." autocomplete="off">
      </div>
      <div class="divider" style="margin: 8px 0;"></div>
      <div class="check-container">
        <button class="check-btn" id="check-btn" type="button" aria-label="Listo">✓</button>
      </div>
    </div>

    <!-- VISTA 4: Estado de mensajería (sale al dar el ✓) -->
    <div id="view-4" class="app-view hidden">
      <div class="status-card" role="button" tabindex="0" data-status="Solicitud completada">Solicitud completada</div>
      <div class="status-card" role="button" tabindex="0" data-status="Entrega en proceso">Entrega en proceso</div>
    </div>
  </section>

  <div id="toast-notification" class="toast-notification" role="status"></div>

  <footer class="below">Desarrollado por Javi&amp;Pau</footer>

  <div id="sheet-feedback" class="sheet" role="dialog" aria-label="Feedback" hidden>
    <h2>Cuéntanos qué mejorar</h2>
    <textarea id="fb" placeholder="Escribe tu mensaje" aria-label="Mensaje de feedback"></textarea>
    <button class="send" id="fbsend" type="button">Enviar</button>
  </div>

  <div id="sheet-settings" class="sheet" role="dialog" aria-label="Ajustes" hidden>
    <h2>Ajustes</h2>
    <div class="row"><span>Notificaciones</span><button class="switch" type="button" role="switch" aria-checked="true" aria-label="Notificaciones"></button></div>
    <div class="row"><span>Vibración</span><button class="switch" type="button" role="switch" aria-checked="false" aria-label="Vibración"></button></div>
    <div class="row"><span>Modo oscuro</span><button id="sw-dark" class="switch" type="button" role="switch" aria-checked="false" aria-label="Modo oscuro"></button></div>
  </div>

  <div class="bottom">
    <button class="bubble" id="b-fb" type="button" aria-label="Enviar feedback" aria-expanded="false">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.5-4.6A8 8 0 1 1 21 12Z"/><path d="M8.5 11h7M8.5 14h4.5"/></svg>
    </button>
    <div class="bar"><button id="go" class="go" type="button" disabled>Continuar</button></div>
    <button class="bubble" id="b-set" type="button" aria-label="Ajustes" aria-expanded="false">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
    </button>
  </div>
</main>

<script>
  const $ = id => document.getElementById(id);

  // Supabase: usa la URL raíz del proyecto, no la ruta /rest/v1/.
  const SUPABASE_URL = "https://nwwahazeuvyxuuseuecr.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_Zq1cWEtBmJd7JWOI4cQcIA_XV9aZF9-";
  const supabaseClient = (window.supabase && window.supabase.createClient)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;
  window.supabaseClient = supabaseClient;
  window.suprenvCurrentRole = null;
  window.suprenvCurrentUser = null;
  const panel = $('panel');
  const fDestino = $('f-destino'), fMonto = $('f-monto');
  const go = $('go'), confirmBox = $('confirm');
  const provBtns = Array.from(document.querySelectorAll('[data-for="prov"] .city'));
  const state = { prov: null, usdt: 0, cur: null };
  let screen = 'welcome';                       // welcome | login | register | request

  const num = s => { const n = parseFloat(String(s).replace(',', '.')); return isFinite(n) && n > 0 ? n : 0; };
  const fmt = n => n ? String(Math.round(n * 100) / 100) : '';

  function setView(v) {
    panel.dataset.view = v;
    fDestino.setAttribute('aria-expanded', String(v === 'prov' || v === 'addr'));
    fMonto.setAttribute('aria-expanded', String(v === 'monto'));
  }
  function refreshRequest() {
    fDestino.textContent = state.prov || 'Destino';
    fDestino.classList.toggle('empty', !state.prov);
    fMonto.textContent = state.usdt ? fmt(state.usdt) + ' USDT' : 'Monto';
    fMonto.classList.toggle('empty', !state.usdt);
    go.disabled = !(state.prov && state.usdt > 0 && state.cur);
    provBtns.forEach(b => b.setAttribute('aria-pressed', String(b.textContent === state.prov)));
  }

  fDestino.addEventListener('click', () => {
    const v = panel.dataset.view;
    setView(v === 'prov' || v === 'addr' ? 'idle' : 'prov');
  });
  fMonto.addEventListener('click', () => {
    setView(panel.dataset.view === 'monto' ? 'idle' : 'monto');
    if (panel.dataset.view === 'monto') $('m-usdt').focus();
  });

  provBtns.forEach(b => b.addEventListener('click', () => {
    state.prov = b.textContent;
    $('addr-prov').textContent = state.prov;
    refresh(); setView('addr');
    $('a-calle').focus();
  }));
  $('addr-prov').addEventListener('click', () => setView('prov'));
  $('addr-done').addEventListener('click', () => setView('idle'));

  // Monto: se escribe en USDT; USD / CUP solo sirven para elegir en qué moneda se entrega el dinero
  const mUsdt = $('m-usdt');
  mUsdt.addEventListener('input', () => { state.usdt = num(mUsdt.value); refresh(); });
  const curBtns = { USD: $('c-usd'), CUP: $('c-cup') };
  Object.keys(curBtns).forEach(k => curBtns[k].addEventListener('click', () => {
    triggerHaptic(18);
    state.cur = k;
    Object.keys(curBtns).forEach(j => {
      curBtns[j].textContent = j === k ? 'OK' : 'Elegir';
      curBtns[j].setAttribute('aria-pressed', String(j === k));
    });
    refresh();
  }));

  // ===== Flujo de Bddh: Continuar → Wallet y Hash → ✓ → Estado de mensajería =====
  const view1 = $('view-1'), view3 = $('view-3'), view4 = $('view-4');
  function triggerHaptic(d) { try { if ('vibrate' in navigator) navigator.vibrate(d); } catch (e) {} }
  const toastEl = $('toast-notification');
  let toastT = null;
  function toast(msg, ms, after) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => { toastEl.classList.remove('show'); if (after) after(); }, ms);
  }
  function showView(n) {
    view1.classList.toggle('hidden', n !== 1);
    view3.classList.toggle('hidden', n !== 3);
    view4.classList.toggle('hidden', n !== 4);
    confirmBox.hidden = true;
    window.scrollTo({ top: 0 });
  }

  const SUPRENV_ADMIN_HTML = "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\">\n<meta name=\"color-scheme\" content=\"dark\">\n<meta name=\"theme-color\" content=\"#050b1c\">\n<title>Mi wallet<\/title>\n<style>\n  /* ===== Estilo \"Mensajero\": azul marino oscuro, vidrio plano, botones físicos que se hunden ===== */\n  :root {\n    color-scheme: dark;\n    --h: 46px;          /* alto de botones/campos */\n    --gap: 8px;\n    --pad: 8px;\n\n    /* Color base */\n    --bg: #050b1c;\n    --green: #7ea3ff;                  /* acento de foco (nombre heredado; es azul) */\n    --text: #ffffff;\n    --ink-soft: rgba(255,255,255,.60);\n\n    /* Bordes de vidrio: arriba, derecha, abajo, izquierda */\n    --g-edge:      rgba(150,180,255,.40) rgba(150,180,255,.13) rgba(150,180,255,.09) rgba(150,180,255,.24);\n    --g-edge-sunk: rgba(0,0,0,.45) rgba(150,180,255,.16) rgba(150,180,255,.24) rgba(0,0,0,.35);\n    --g-hair: rgba(0,0,0,.55);\n\n    /* Sombras */\n    --g-ledge: rgba(0,0,0,.50);\n    --g-drop:  rgba(0,0,0,.55);\n    --g-insh:  rgba(0,0,0,.55);\n\n    /* Botón normal (reposo) y hundido */\n    --key: rgba(24,30,52,.90);\n    --p-top: #030816;  --p-bot: #060e22;\n\n    /* Botón de acción principal */\n    --g-ac-top: #3566d6;  --g-ac-mid: #2d58c0;  --g-ac-bot: #2650ab;  --g-ac-txt: #ffffff;\n    --g-acp-top: #1a3f8c; --g-acp-bot: #204a9f;\n\n    /* Marcos de vidrio */\n    --f-top: rgba(150,180,255,.026); --f-mid: rgba(150,180,255,.007); --f-bot: rgba(150,180,255,.018);\n\n    /* Hoja/modal */\n    --s-top: #0d1a38; --s-bot: #08122a;\n\n    /* Campos hundidos */\n    --w-top: rgba(0,0,0,.55); --w-bot: rgba(150,180,255,.04);\n\n    --g-ts: 0 1px 2px rgba(0,0,0,.6);\n\n    box-sizing: border-box;\n    padding-top: env(safe-area-inset-top, 0px);\n    padding-bottom: env(safe-area-inset-bottom, 0px);\n  }\n  @media (max-height: 720px) { :root { --h: 42px; } }\n  html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }\n  *, *::before, *::after { box-sizing: border-box; }\n  html, body { margin: 0; min-height: 100%; }\n  body {\n    background-color: var(--bg); background-image: none;\n    color: var(--text);\n    font-family: -apple-system, BlinkMacSystemFont, \"SF Pro Display\", \"SF Pro Text\", \"Helvetica Neue\", Arial, sans-serif;\n    -webkit-font-smoothing: antialiased;\n    text-shadow: 0 1px 3px rgba(0,25,24,.55), 0 0 1px rgba(0,25,24,.35);\n  }\n  button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }\n\n  .screen { position: relative; max-width: 430px; margin: 0 auto; min-height: 100vh; padding-bottom: 88px; overflow: hidden;\n            padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }\n\n  /* Logo y bolitas: capa aparte, fija y sin respuesta al toque */\n  .orbit { position: relative; height: 186px; margin-top: 0; }\n  .planet { position: fixed; left: 0; top: 0; z-index: 1; pointer-events: none; will-change: transform; }\n  .logo-main { position: absolute; left: 50%; top: 50%; width: 108px; height: 108px; transform: translate(-50%, -50%); }\n\n  /* Estiramiento elástico de la interfaz (las bolas no se tocan) */\n  \n\n  /* ---- Marcos de vidrio: tarjeta, panel, hoja, aviso ---- */\n  .card, .panel, .sheet, .toast-notification {\n    border: 1.5px solid; border-color: var(--g-edge);\n    background: linear-gradient(180deg, var(--f-top) 0%, var(--f-mid) 55%, var(--f-bot) 100%);\n    -webkit-backdrop-filter: blur(2px) saturate(120%); backdrop-filter: blur(2px) saturate(120%);\n    box-shadow:\n      inset 0 1px 0 rgba(170,200,255,.16),\n      inset 0 -1px 0 rgba(170,200,255,.04),\n      0 0 0 1px var(--g-hair),\n      0 18px 30px -14px var(--g-drop);\n  }\n  .card  { position: relative; z-index: 2; border-radius: 26px; margin: 0 24px; padding: 14px 12px; }\n  .panel { position: relative; border-radius: 20px; padding: var(--pad); display: flex; flex-direction: column; gap: var(--gap); min-height: 196px; }\n  .sheet { position: fixed; left: 50%; transform: translateX(-50%); z-index: 4;\n           width: min(100% - 28px, 402px); bottom: calc(90px + env(safe-area-inset-bottom, 0px));\n           border-radius: 22px; padding: 18px; background: linear-gradient(180deg, var(--s-top), var(--s-bot));\n           -webkit-backdrop-filter: blur(10px) saturate(130%); backdrop-filter: blur(10px) saturate(130%); }\n  .sheet[hidden] { display: none; }\n  @media (max-width: 379px) { .card { margin: 0 16px; padding: 12px 8px; } }\n\n  /* Título / cartel */\n  .title {\n    position: relative; z-index: 2; width: auto; max-width: 90%; margin: -6px auto 14px; padding: 0;\n    border: 0; background: none; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; border-radius: 0;\n    text-align: center; text-transform: uppercase; font-weight: 800; letter-spacing: .06em;\n    font-size: clamp(13px, 3.7vw, 16px); line-height: 1.22; text-wrap: balance; color: var(--text); pointer-events: none;\n  }\n\n  .grid { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: 10px; align-items: center; }\n  @media (max-width: 379px) { .grid { grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); gap: 6px; } }\n\n  /* Campos de la izquierda (botones que abren el panel) */\n  .fields { display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; align-self: center; margin: 0; }\n\n  .panel [data-for] { display: none; flex-direction: column; gap: var(--gap); }\n  .panel[data-view=\"idle\"] [data-for=\"idle\"],\n  .panel[data-view=\"prov\"] [data-for=\"prov\"],\n  .panel[data-view=\"addr\"] [data-for=\"addr\"],\n  .panel[data-view=\"monto\"] [data-for=\"monto\"] { display: flex; }\n  .panel[data-view=\"prov\"] { padding-bottom: var(--pad); }\n  .panel[data-view=\"addr\"] { paddi \n      <button class=\"mnav l\" id=\"s-prev\" type=\"button\" aria-label=\"Anteriores\"><svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5l-7 7 7 7\"/><\/svg><\/button>\n      <div class=\"strip\" id=\"strip\" role=\"list\"><\/div>\n      <button class=\"mnav r\" id=\"s-next\" type=\"button\" aria-label=\"Siguientes\"><svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 5l7 7-7 7\"/><\/svg><\/button>\n    <\/div>\n  <\/section>\n\n  <div id=\"toast-notification\" class=\"toast-notification\" role=\"status\"><\/div>\n<\/main>\n\n<!-- Chat con el cliente o gestor -->\n<section class=\"chat\" id=\"chat\" role=\"dialog\" aria-label=\"Chat\" hidden>\n  <header class=\"chat-head\">\n    <button class=\"bubble chat-back\" id=\"chat-back\" type=\"button\" aria-label=\"Volver\"><svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5l-7 7 7 7\"/><\/svg><\/button>\n    <span class=\"avatar sm\" id=\"chat-avatar\"><svg viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8.5\" r=\"4.2\"/><path d=\"M3.5 21c.6-4.6 4-7 8.5-7s7.9 2.4 8.5 7z\"/><\/svg><\/span>\n    <div class=\"chat-who\"><div class=\"chat-name\" id=\"chat-name\"><\/div><div class=\"chat-role\" id=\"chat-role\"><\/div><\/div>\n  <\/header>\n  <div class=\"chat-log\" id=\"chat-log\" aria-live=\"polite\"><\/div>\n  <div class=\"chat-input\">\n    <input class=\"base-in\" id=\"chat-text\" type=\"text\" placeholder=\"Escribe un mensaje\" autocomplete=\"off\" aria-label=\"Mensaje\" enterkeyhint=\"send\">\n    <button class=\"done\" id=\"chat-send\" type=\"button\">Enviar<\/button>\n  <\/div>\n<\/section>\n\n<!-- Mi cuenta -->\n<section class=\"chat\" id=\"acct\" role=\"dialog\" aria-label=\"Mi cuenta\" hidden>\n  <header class=\"chat-head\">\n    <button class=\"bubble chat-back\" id=\"acct-back\" type=\"button\" aria-label=\"Volver\"><svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5l-7 7 7 7\"/><\/svg><\/button>\n    <div class=\"acct-title\">Mi cuenta<\/div>\n  <\/header>\n  <div class=\"chat-log\">\n    <div class=\"photo-row\">\n      <span class=\"avatar big\" id=\"acct-avatar\"><\/span>\n      <button class=\"city\" id=\"photo-btn\" type=\"button\">Cambiar foto<\/button>\n      <input type=\"file\" id=\"photo-in\" accept=\"image/*\" hidden>\n    <\/div>\n    <div class=\"fld\"><label for=\"f-user\">Nombre de usuario<\/label><input class=\"base-in\" id=\"f-user\" type=\"text\" autocomplete=\"off\" autocapitalize=\"none\" spellcheck=\"false\"><\/div>\n    <div class=\"fld\"><label for=\"f-pass\">Contraseña<\/label>\n      <div class=\"pw\"><input class=\"base-in\" id=\"f-pass\" type=\"password\" autocomplete=\"new-password\"><button class=\"city\" id=\"pass-eye\" type=\"button\">Ver<\/button><\/div><\/div>\n    <div class=\"fld\"><label for=\"f-nom\">Nombre y apellido<\/label><input class=\"base-in\" id=\"f-nom\" type=\"text\" autocomplete=\"off\"><\/div>\n    <div class=\"fld\"><label for=\"f-edad\">Edad<\/label><input class=\"base-in\" id=\"f-edad\" type=\"number\" inputmode=\"numeric\" min=\"0\" max=\"120\" autocomplete=\"off\"><\/div>\n    <div class=\"fld\"><label for=\"f-ci\">Carnet de identidad<\/label><input class=\"base-in\" id=\"f-ci\" type=\"text\" inputmode=\"numeric\" autocomplete=\"off\"><\/div>\n    <div class=\"fld\"><label for=\"f-tel\">Teléfono<\/label><input class=\"base-in\" id=\"f-tel\" type=\"tel\" inputmode=\"tel\" autocomplete=\"off\"><\/div>\n    <button class=\"done\" id=\"acct-save\" type=\"button\">Guardar cambios<\/button>\n    <button class=\"city\" id=\"acct-out\" type=\"button\">Cerrar sesión<\/button>\n    <div class=\"pdiv\"><\/div>\n    <button class=\"city\" id=\"ref-gen\" type=\"button\">Generar link de referido (gestor)<\/button>\n    <div class=\"fld\" id=\"ref-box\" hidden>\n      <label for=\"ref-link\">Link para crear una cuenta de gestor<\/label>\n      <div class=\"base-in v\" id=\"ref-link\" style=\"word-break:break-all;font-size:13px\"><\/div>\n      <p class=\"hint\" id=\"ref-note\"><\/p>\n      <button class=\"city\" id=\"ref-copy\" type=\"button\">Copiar link<\/button>\n    <\/div>\n    <div class=\"pdiv\"><\/div>\n    <div class=\"fld\">\n      <label>Gestores<\/label>\n      <div class=\"ges-list\" id=\"ges-list\"><p class=\"hint\">Cargando…<\/p><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- Operaciones en proceso: publicadas al mensajero y pendientes de mi OK -->\n<section class=\"chat\" id=\"proc\" role=\"dialog\" aria-label=\"Operaciones en proceso\" hidden>\n  <header class=\"chat-head\">\n    <button class=\"bubble chat-back\" id=\"proc-back\" type=\"button\" aria-label=\"Volver\"><svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5l-7 7 7 7\"/><\/svg><\/button>\n    <div class=\"acct-title proc-title\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 12a8 8 0 0 0-13.6-5.7L4 8.7\"/><path d=\"M4 4.5v4.2h4.2\"/><path d=\"M4 12a8 8 0 0 0 13.6 5.7L20 15.3\"/><path d=\"M20 19.5v-4.2h-4.2\"/><\/svg><span>En proceso<\/span><\/div>\n  <\/header>\n  <div class=\"chat-log\" id=\"proc-log\" aria-live=\"polite\"><\/div>\n<\/section>\n\n<!-- Solicitud de entrega: cartel que sale cuando aparece una entrega -->\n<div class=\"req-back\" id=\"req\" hidden>\n  <div class=\"req-wrap\" id=\"req-dlg\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"req-title\" tabindex=\"-1\">\n    <h2 class=\"req-title\" id=\"req-title\">Solicitud de entrega<\/h2>\n    <section class=\"req-card\">\n      <div class=\"req-row\"><span class=\"k\">Cliente<\/span>\n        <button class=\"city req-cli\" id=\"r-cli\" type=\"button\" aria-haspopup=\"true\" aria-expanded=\"false\" aria-controls=\"r-menu\"><span id=\"r-cli-t\"><\/span><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"/><\/svg><\/button><\/div>\n      <div class=\"req-menu\" id=\"r-menu\" hidden>\n        <button class=\"city\" id=\"r-chat\" type=\"button\">Chatear<\/button>\n      <\/div>\n      <div class=\"req-row\"><span class=\"k\">Nombre<\/span><div class=\"base-in v\" id=\"r-nom\"><\/div><\/div>\n      <div class=\"req-row\"><span class=\"k\">Dirección<\/span><div class=\"base-in v\" id=\"r-dir\"><\/div><\/div>\n      <div class=\"req-row\"><span class=\"k\">Teléfono<\/span><div class=\"base-in v\" id=\"r-tel\"><\/div><\/div>\n      <div class=\"req-row\"><span class=\"k\">Cantidad<\/span><div class=\"base-in v\" id=\"r-can\"><\/div><\/div>\n      <div class=\"req-row\" id=\"r-usdt-row\" style=\"display:none\"><span class=\"k\">USDT a recibir<\/span><div class=\"base-in v\" id=\"r-usdt\"><\/div><\/div>\n      <div class=\"req-row\" id=\"r-hash-row\" style=\"display:none\"><span class=\"k\">Hash<\/span><div class=\"base-in v\" id=\"r-hash\" style=\"word-break:break-all;font-size:12px\"><\/div><\/div>\n      <div class=\"req-row\"><span class=\"k\">ID de operación<\/span><div class=\"base-in v\" id=\"r-id\"><\/div><\/div>\n      <div class=\"pdiv\"><\/div>\n      <div class=\"req-btns\">\n        <div class=\"base-in conf\" id=\"r-dep\">Depósito confirmado<\/div>\n        <button class=\"done\" id=\"r-pub\" type=\"button\">Publicar<\/button>\n      <\/div>\n    <\/section>\n  <\/div>\n<\/div>\n\n<!-- Operación completada: sale cuando el gestor termina la operación -->\n<div class=\"req-back\" id=\"fin\" hidden>\n  <div class=\"req-wrap\" id=\"fin-dlg\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Operación completada\" tabindex=\"-1\">\n    <section class=\"req-card\">\n      <div class=\"done-top\">\n        <span class=\"avatar\" id=\"f-av\"><\/span>\n        <div class=\"base-in v\" id=\"f-msg\" role=\"status\"><\/div>\n      <\/div>\n      <div class=\"req-row\"><span class=\"k\">Precio<\/span><div class=\"base-in v sm\" id=\"f-pre\"><\/div><\/div>\n      <div class=\"req-row\"><span class=\"k\">Cantidad entregada<\/span><div class=\"base-in v\" id=\"f-can\"><\/div><\/div>\n      <div class=\"req-row\"><span class=\"k\">Wallet<\/span><div class=\"base-in v\" id=\"f-wal\"><\/div><\/div>\n      <div class=\"req-copy\"><button class=\"city\" id=\"f-copy\" type=\"button\">Copiar<\/button><\/div>\n      <div class=\"req-row\"><span class=\"k\">Hash<\/span><div class=\"base-in v\" id=\"f-hash\"><\/div><\/div>\n      <div class=\"req-idrow\"><span class=\"k\">ID de operación<\/span><div class=\"base-in v\" id=\"f-id\"><\/div><\/div>\n      <div class=\"fin-actions\">\n        <button class=\"city\" id=\"f-shot\" type=\"button\">Ver foto<\/button>\n        <button class=\"done\" id=\"f-ok\" type=\"button\" title=\"Ya le pagué al mensajero\" aria-label=\"OK, ya le pagué al mensajero\">OK<\/button>\n      <\/div>\n    <\/section>\n    <p class=\"req-hint\">Toca fuera para cerrar<\/p>\n  <\/div>\n<\/div>\n\n<!-- Imagen de prueba: foto que tomó el gestor al entregar -->\n<div class=\"req-back\" id=\"shot\" hidden>\n  <div class=\"req-wrap\" id=\"shot-dlg\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"shot-title\" tabindex=\"-1\">\n    <h2 class=\"req-title\" id=\"shot-title\">Foto de la entrega<\/h2>\n    <section class=\"req-card\">\n      <img class=\"shot-img\" id=\"shot-img\" alt=\"Foto que tomó el gestor al entregar\">\n      <p class=\"req-hint\" id=\"shot-cap\"><\/p>\n    <\/section>\n    <p class=\"req-hint\">Toca fuera para cerrar<\/p>\n  <\/div>\n<\/div>\n\n<script>\n  const $ = id => document.getElementById(id);\n  const PERSON = '<svg viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8.5\" r=\"4.2\"/><path d=\"M3.5 21c.6-4.6 4-7 8.5-7s7.9 2.4 8.5 7z\"/><\/svg>';\n  const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;\n\n  // Guardado local (si el navegador lo permite)\n  const store = {\n    get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },\n    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }\n  };\n  function haptic(d) { try { if ('vibrate' in navigator) navigator.vibrate(d); } catch (e) {} }\n\n  // ----- Aviso -----\n  const toastEl = $('toast-notification'); let toastT;\n  function toast(msg, ms) {\n    toastEl.textContent = msg; toastEl.classList.add('show');\n    clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), ms || 1400);\n  }\n\n  // ----- Datos reales de Supabase; la wallet se muestra solo en lectura -----\n  const wallet = $('wallet');\n  wallet.readOnly = true;\n  wallet.setAttribute('aria-readonly', 'true');\n  const DATA = {\n    cli: { role: 'Cliente', hint: 'No hay clientes registrados', people: [] },\n    ges: { role: 'Gestor', hint: 'No hay gestores registrados', people: [] }\n  };\n  function supabaseAdminClient() {\n    try { return window.parent && window.parent.supabaseClient ? window.parent.supabaseClient : null; }\n    catch (e) { return null; }\n  }\n  function extractWallet(value) {\n    if (typeof value === 'string') {\n      const s = value.trim();\n      if (!s) return '';\n      try { return extractWallet(JSON.parse(s)); } catch (_) { return s; }\n    }\n    if (Array.isArray(value)) return value.length ? extractWallet(value[0]) : '';\n    if (value && typeof value === 'object') {\n      for (const k of ['address','wallet','wallet_address','payment_wallet','payout_wallet']) {\n        if (typeof value[k] === 'string' && value[k].trim()) return value[k].trim();\n      }\n      for (const v of Object.values(value)) { if (v && typeof v === 'object') { const found = extractWallet(v); if (found) return found; } }\n    }\n    return '';\n  }\n  // Estado de cada lista: idle | loading | ok | error. Un error nunca se muestra como \"lista vacía\".\n  const LIST = { cli: { status: 'idle', msg: '' }, ges: { status: 'idle', msg: '' } };\n  let loadInFlight = null;\n  function friendlyError(err, fn) {\n    const raw = String((err && (err.message || err.msg || err.error)) || err || '');\n    const code = err && err.code ? String(err.code) : '';\n    if (/not_authorized/i.test(raw)) return 'Tu sesión no tiene permiso de administrador (not_authorized). Cierra sesión y entra con la cuenta de administrador.';\n    if (code === 'PGRST301' || /jwt|expired|not authenticated|invalid token/i.test(raw)) return 'La sesión caducó. Vuelve a iniciar sesión.';\n    if (/failed to fetch|networkerror|network request|timeout/i.test(raw)) return 'Sin conexión con Supabase. Revisa tu internet y vuelve a tocar el botón.';\n    if (code === 'PGRST202' || /could not find the function|schema cache/i.test(raw)) return 'La función ' + fn + ' no existe en Supabase o no está disponible para esta sesión.';\n    return 'No se pudo cargar la lista (' + fn + '): ' + (raw || 'error desconocido');\n  }\n  function fail(msg, tech) { const e = new Error(tech || msg); e.friendly = msg; return e; }\n  function nameOf(p, fallback) {\n    if (!p) return fallback;\n    return String(p.full_name || '').trim() || String(p.username || '').trim() || p.email || p.id || fallback;\n  }\n  function roleLine(kind, rec) {\n    const parts = [DATA[kind].role];\n    if (rec && rec.phone) parts.push(rec.phone);\n    if (rec && rec.is_active === false) parts.push('inactivo');\n    if (rec && rec.created_at) {\n      const d = new Date(rec.created_at);\n      if (!isNaN(d)) parts.push('desde ' + d.toLocaleDateString('es', { day: 'numeric', month: 'short', year: 'numeric' }));\n    }\n    return parts.join(' · ');\n  }\n  function listMessage(kind) {\n    const st = LIST[kind];\n    if (st.status === 'loading' || st.status === 'idle') return 'Cargando…';\n    if (st.status === 'error') return st.msg || 'No se pudo cargar la lista.';\n    return DATA[kind].people.length ? '' : DATA[kind].hint;\n  }\n  async function fetchAdminData() {\n    const sb = supabaseAdminClient();\n    if (!sb) throw fail('No se pudo acceder a la conexión con Supabase de la ventana principal. Cierra el panel y vuelve a iniciar sesión.', 'window.parent.supabaseClient no existe');\n    const ses = await sb.auth.getSession();\n    if (ses.error || !ses.data || !ses.data.session) throw fail('No hay sesión activa. Vuelve a iniciar sesión.', 'getSession sin sesión');\n    // La wallet se lee aparte para que un fallo suyo no bloquee las listas\n    Promise.resolve(sb.rpc('get_payment_wallet')).then(res => {\n      if (res.error) { console.error('get_payment_wallet:', res.error); wallet.value = 'No se pudo leer la wallet'; return; }\n      wallet.value = extractWallet(res.data) || 'Wallet no configurada';\n    }).catch(e => { console.error('get_payment_wallet:', e); wallet.value = 'No se pudo leer la wallet'; });\n    const res = await sb.rpc('admin_list_users');\n    if (res.error) { console.error('admin_list_users:', res.error); throw fail(friendlyError(res.error, 'admin_list_users'), res.error.message); }\n    // Normaliza la respuesta por si llega como JSON serializado o envuelta en una fila\n    let result = res.data;\n    if (typeof result === 'string') { try { result = JSON.parse(result); } catch (_) {} }\n    if (Array.isArray(result) && result.length === 1 && result[0] && typeof result[0] === 'object') result = result[0];\n    if (result && result.data && typeof result.data === 'object' && !Array.isArray(result.clients)) result = result.data;\n    result = result && typeof result === 'object' ? result : {};\n    const hasC = Array.isArray(result.clients) || Array.isArray(result.client);\n    const hasM = Array.isArray(result.managers) || Array.isArray(result.gestores);\n    if (!hasC && !hasM) {\n      console.error('admin_list_users: respuesta sin clients/managers:', res.data);\n      if (typeof result.error === 'string') throw fail(friendlyError(result.error, 'admin_list_users'), result.error);\n      throw fail('Supabase respondió con una estructura inesperada (se esperaba { clients, managers }). Detalles en la consola.');\n    }\n    const clients = Array.isArray(result.clients) ? result.clients : (Array.isArray(result.client) ? result.client : []);\n    const managers = Array.isArray(result.managers) ? result.managers : (Array.isArray(result.gestores) ? result.gestores : []);\n    DATA.cli.records = clients;\n    DATA.ges.records = managers;\n    DATA.cli.people = clients.map(p => nameOf(p, 'Usuario'));\n    DATA.ges.people = managers.map(p => nameOf(p, 'Gestor'));\n    DATA.cli.hint = 'No hay clientes registrados';\n    DATA.ges.hint = 'No hay gestores registrados';\n    LIST.cli = { status: 'ok', msg: '' };\n    LIST.ges = { status: 'ok', msg: '' };\n    if (!clients.length) console.warn('admin_list_users devolvió una lista de clientes vacía:', res.data);\n  }\n  // Nunca rechaza: deja el estado en LIST y el botón siempre queda usable\n  async function refreshPeople() {\n    if (loadInFlight) return loadInFlight;\n    LIST.cli.status = 'loading'; LIST.ges.status = 'loading';\n    loadInFlight = (async () => {\n      try { await fetchAdminData(); }\n      catch (e) {\n        console.error('Carga del panel:', e);\n        const msg = e && e.friendly ? e.friendly : friendlyError(e, 'admin_list_users');\n        LIST.cli = { status: 'error', msg };\n        LIST.ges = { status: 'error', msg };\n        toast(msg, 3200);\n      } finally { loadInFlight = null; }\n    })();\n    return loadInFlight;\n  }\n\n  // ----- Mi ganancia: se conserva el estilo y valor visual actual -----\n  const GANANCIA_OP = 500;\n  $('gain').textContent = String(GANANCIA_OP);\n  const bCli = $('b-cli'), bGes = $('b-ges'), hint = $('list-hint');\n  const stripRow = $('strip-row'), strip = $('strip'), sPrev = $('s-prev'), sNext = $('s-next');\n  let current = null;\n\n  function updateArrows() {\n    sPrev.disabled = strip.scrollLeft <= 2;\n    sNext.disabled = strip.scrollLeft + strip.clientWidth >= strip.scrollWidth - 2;\n  }\n  function showList(kind) {\n    current = kind;\n    bCli.setAttribute('aria-pressed', String(kind === 'cli'));\n    bGes.setAttribute('aria-pressed', String(kind === 'ges'));\n    strip.innerHTML = '';\n    if (!kind) {\n      stripRow.hidden = true;\n      hint.hidden = false; hint.textContent = 'Toca Clientes o Gestores para ver tu lista';\n      return;\n    }\n    const d = DATA[kind];\n    const msg = listMessage(kind);\n    if (msg) { stripRow.hidden = true; hint.hidden = false; hint.textContent = msg; return; }\n    hint.hidden = true;\n    d.people.forEach((name, i) => {\n      const b = document.createElement('button');\n      b.className = 'profile'; b.type = 'button'; b.setAttribute('role', 'listitem');\n      b.setAttribute('aria-label', 'Abrir chat con ' + name);\n      b.innerHTML = '<span class=\"avatar\">' + PERSON + '<\/span><span class=\"pname\"><\/span>';\n      b.querySelector('.pname').textContent = name;\n      b.addEventListener('click', () => { haptic(15); openChat(kind, i); });\n      strip.appendChild(b);\n    });\n    stripRow.hidden = false; strip.scrollLeft = 0;\n    requestAnimationFrame(updateArrows);\n  }\n  // Al tocar: se pide la lista a Supabase, se ve \"Cargando…\" y luego el resultado (o el error).\n  function onListTap(kind) {\n    haptic(15);\n    const p = refreshPeople();\n    showList(kind);\n    p.then(() => { if (current === kind) showList(kind); });\n  }\n  bCli.addEventListener('click', () => onListTap('cli'));\n  bGes.addEventListener('click', () => onListTap('ges'));\n  strip.addEventListener('scroll', updateArrows, { passive: true });\n  window.addEventListener('resize', updateArrows);\n  const page = () => Math.max(120, strip.clientWidth * 0.85);\n  sPrev.addEventListener('click', () => strip.scrollBy({ left: -page(), behavior: 'smooth' }));\n  sNext.addEventListener('click', () => strip.scrollBy({ left: page(), behavior: 'smooth' }));\n\n  // ----- Chat -----\n  const chat = $('chat'), log = $('chat-log'), txt = $('chat-text');\n  let chatKey = null;\n  const loadMsgs = () => { try { return JSON.parse(store.get(chatKey) || '[]'); } catch (e) { return []; } };\n  const saveMsgs = m => store.set(chatKey, JSON.stringify(m.slice(-200)));\n  const hhmm = ts => new Date(ts).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });\n\n  function addBubble(m) {\n    const el = document.createElement('div');\n    el.className = 'msg ' + (m.from === 'me' ? 'me' : 'them');\n    el.appendChild(document.createTextNode(m.text));\n    const t = document.createElement('small'); t.textContent = hhmm(m.t); el.appendChild(t);\n    log.appendChild(el);\n  }\n  function renderChat(name) {\n    log.innerHTML = '';\n    const msgs = loadMsgs();\n    if (!msgs.length) {\n      const p = document.createElement('p'); p.className = 'hint'; p.id = 'chat-empty';\n      p.textContent = 'Aún no hay mensajes con ' + name + '. Escribe el primero.'; log.appendChild(p);\n    } else msgs.forEach(addBubble);\n    log.scrollTop = log.scrollHeight;\n  }\n  function openChat(kind, i) {\n    const name = DATA[kind].people[i];\n    const rec = (DATA[kind].records || [])[i] || {};\n    chatKey = 'suprenv_chat_' + kind + '_' + (rec.id || i);\n    $('chat-name').textContent = name; $('chat-role').textContent = roleLine(kind, rec);\n    renderChat(name); txt.value = '';\n    chat.hidden = false; document.documentElement.classList.add('chat-open');\n  }\n  function closeChat() {\n    chat.hidden = true; document.documentElement.classList.remove 5,255,.25); }\n  .confirm[hidden] { display: none; }\n\n  /* Lista de provincias: scroll interno */\n  /* rueda: se ven 4 botones (4 × 36px + 3 × 8px de separación) y al deslizar salen los demás */\n  .panel [data-for=\"prov\"] { gap: 0; }\n  .prov-list { display: flex; flex-direction: column; gap: var(--gap); max-height: 141px; overflow-y: auto; overflow-x: hidden; padding: 2px 6px; scroll-snap-type: y mandatory; scroll-padding: 2px 0; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scrollbar-width: none; }\n  .prov-list::-webkit-scrollbar { display: none; }\n  .panel [data-for=\"prov\"] .city { flex: none; scroll-snap-align: start; height: 36px; font-size: 14px; line-height: 1.1; padding: 0 8px; white-space: normal; overflow-wrap: anywhere; }\n  .panel [data-for=\"prov\"] .city.long { font-size: 12.5px; }\n  @media (max-width: 339px) { .panel [data-for=\"prov\"] .city { font-size: 12px; } }\n\n  /* Fila inferior fija */\n  .bottom {\n    position: fixed; left: 50%; transform: translateX(-50%);\n    width: min(100%, 430px); padding: 0 14px;\n    bottom: calc(16px + env(safe-area-inset-bottom, 0px));\n    display: flex; align-items: center; gap: 10px; z-index: 5;\n  }\n  .bar { flex: 1; min-width: 0; padding: 0; border: 0; background: none; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }\n\n  /* Botón de cuenta (círculo con etiqueta) arriba a la izquierda */\n  .topbar {\n    position: fixed; left: 50%; transform: translateX(-50%);\n    width: min(100%, 430px); padding: 0 16px;\n    top: calc(10px + env(safe-area-inset-top, 0px));\n    display: flex; align-items: flex-start; z-index: 5; pointer-events: none;\n  }\n  .acc-wrap { pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 7px; }\n  .acc-label { font-size: 15px; font-weight: 800; letter-spacing: .06em; color: var(--text); cursor: pointer; text-shadow: var(--g-ts); }\n\n  .acc-circle {\n    position: relative; top: 0; flex: none; width: 88px; height: 88px; padding: 0; border-radius: 50%;\n    display: grid; place-items: center; cursor: pointer; color: #a9b9ee;\n    border: 2px solid rgba(110,140,230,.55);\n    background: radial-gradient(circle at 30% 20%, #2f4590 0%, #1b2c66 48%, #0d1840 100%);\n    box-shadow: inset 0 1px 0 rgba(170,200,255,.28), 0 4px 0 rgba(0,0,0,.5), 0 10px 16px -8px rgba(0,0,0,.65);\n    transition: top .08s ease-out, box-shadow .08s ease-out;\n  }\n  .acc-circle svg { width: 50px; height: 50px; }\n  .acc-circle:active, .acc-circle.is-pressed {\n    top: 4px; outline: none;\n    box-shadow: inset 0 4px 8px rgba(0,0,0,.55), inset 0 -1px 0 rgba(255,255,255,.2), 0 0 0 1px rgba(0,0,0,.55);\n  }\n  .acc-circle:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }\n  .acc-circle img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }\n\n  /* Página \"Mi cuenta\": entra deslizando desde la derecha */\n  .acc-page {\n    position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; overscroll-behavior: contain;\n    -webkit-overflow-scrolling: touch; scrollbar-width: none;\n    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);\n    transform: translateX(100%); visibility: hidden;\n    transition: transform .32s cubic-bezier(.22,.9,.3,1), visibility 0s linear .32s;\n  }\n  .acc-page::-webkit-scrollbar { display: none; }\n  .acc-page.open { transform: translateX(0); visibility: visible; transition: transform .32s cubic-bezier(.22,.9,.3,1), visibility 0s; }\n  .acc-inner { max-width: 430px; margin: 0 auto; }\n  .acc-head { position: sticky; top: 0; z-index: 2; display: grid; grid-template-columns: 42px 1fr 42px; align-items: center; gap: 14px; padding: 12px 16px;\n              background: var(--bg); }\n  .acc-head h2 { margin: 0; text-align: center; font-size: 19px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }\n  .acc-card { position: relative; border-radius: 26px; padding: 18px 14px 16px; }\n  .city.acc-key { width: auto; flex: none; height: 42px; padding: 0 16px; font-size: 15px; }\n  .city.acc-back { width: 42px; padding: 0; display: grid; place-items: center; }\n  .acc-body { padding: 18px 16px 28px; }\n  .acc-photo { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 20px; }\n  .acc-f { margin-bottom: 14px; }\n  .acc-f > label { display: block; margin: 0 4px 8px; font-size: 16px; font-weight: 800; color: var(--text); }\n  .acc-f .row2 { display: flex; gap: 10px; align-items: center; }\n  .acc-f .base-in { font-size: 16px; }\n  .acc-f .row2 .city.acc-key { height: var(--h); padding: 0 18px; }\n  .done.acc-save { width: 100%; align-self: stretch; height: 50px; margin-top: 8px; font-size: 17px; }\n\n  /* Hojas */\n  .sheet h2 { margin: 0 0 12px; font-size: 19px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }\n  .row-btn { width: 100%; background: none; border: 0; color: var(--text); text-align: left; cursor: pointer; font-weight: 700; }\n  .row-l { display: flex; align-items: center; gap: 12px; }\n  .set-avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; overflow: hidden; color: #a9b9ee;\n    border: 1.5px solid rgba(110,140,230,.55); background: radial-gradient(circle at 30% 20%, #2f4590 0%, #1b2c66 48%, #0d1840 100%); }\n  .set-avatar svg { width: 20px; height: 20px; }\n  .set-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }\n  .row { display: flex; align-items: center; justify-content: space-between; padding: 8px 2px; font-size: 17px; }\n\n  /* Interruptor */\n  .switch {\n    position: relative; width: 52px; height: 30px; padding: 0; border-radius: 10px; cursor: pointer;\n    border: 1.5px solid; border-color: var(--g-edge-sunk);\n    background: linear-gradient(180deg, var(--w-top), var(--w-bot));\n    box-shadow: inset 0 2px 5px var(--g-insh), 0 0 0 1px var(--g-hair);\n    transition: background .2s, box-shadow .2s;\n  }\n  .switch::after {\n    content: \"\"; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 7px;\n    border: 1px solid; border-color: var(--g-edge);\n    background: linear-gradient(180deg, #f4f7ff, #bccaee);\n    box-shadow: 0 2px 0 var(--g-ledge), 0 4px 6px -2px var(--g-drop);\n    transition: transform .18s ease-out, top .08s ease-out, box-shadow .08s ease-out;\n  }\n  .switch:active::after { top: 4px; box-shadow: 0 1px 0 var(--g-ledge); }\n  .switch[aria-checked=\"true\"] { background: linear-gradient(180deg, var(--g-ac-top), var(--g-ac-bot)); }\n  .switch[aria-checked=\"true\"]::after { transform: translateX(21px); }\n  .switch:focus-visible { outline: 2px solid rgba(255,255,255,.7); outline-offset: 2px; }\n\n  /* Aviso emergente */\n  .toast-notification {\n    position: fixed; bottom: 100px; left: 50%; z-index: 1000; max-width: calc(100% - 40px);\n    transform: translateX(-50%) translateY(20px); opacity: 0; visibility: hidden; text-align: center;\n    padding: 13px 28px; border-radius: 16px; border-width: 1.5px;\n    font-size: 15px; font-weight: 800; letter-spacing: .03em; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5);\n    background: linear-gradient(180deg, var(--g-ac-top) 0%, var(--g-ac-bot) 100%);\n    transition: all .3s cubic-bezier(.34, 1.56, .64, 1);\n  }\n  .toast-notification.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }\n\n  /* Pie */\n  footer.below {\n    position: relative; z-index: 2; display: block; margin: 14px auto 0; width: auto; max-width: 90%; height: auto; padding: 0; text-align: center;\n    border: 0; border-radius: 0; background: none; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none;\n    font-size: 10.5px; line-height: 1.2; font-weight: 700; letter-spacing: .06em; white-space: nowrap; pointer-events: none;\n    color: rgba(255,255,255,.55); text-shadow: 0 1px 2px rgba(0,25,24,.5);\n  }\n  @media (max-height: 659px) { footer.below { display: none; } }\n\n  /* ===== Vistas 3 y 4: Wallet/Hash y estado de mensajería ===== */\n  .app-view { display: flex; flex-direction: column; width: 100%; }\n  .app-view.hidden, .grid.hidden { display: none; }\n  .divider { width: 100%; height: 2px; margin: 10px 0; border-radius: 2px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); }\n  .black-pill {\n    width: 105px; height: 38px; display: flex; align-items: center; justify-content: center; text-align: center;\n    border-radius: 12px; font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 6px;\n    border: 1.5px solid; border-color: var(--g-edge);\n    background: linear-gradient(180deg, var(--f-top), var(--f-bot)), rgba(150,180,255,.06);\n    box-shadow: inset 0 1px 0 rgba(170,200,255,.16), 0 0 0 1px var(--g-hair);\n  }\n  .copiar-container, .check-container { display: flex; justify-content: flex-end; }\n  .copiar-container { margin: 2px 0 10px 0; }\n  .check-container { margin-top: 4px; }\n  .copiar-btn { height: auto; padding: 8px 22px; font-size: 13px; }\n  .check-btn { width: 48px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; }\n  #view-4 { gap: 20px; min-height: 124px; justify-content: center; align-items: center; }\n  /* Vista 5: Operación completada */\n  .ci-grid { display: grid; grid-template-columns: auto auto; justify-content: center; gap: 18px 14px; align-items: center; justify-items: center; padding: 6px 4px 2px; }\n  .ci-label { text-align: center; font-size: 16px; font-weight: 700; color: var(--text); }\n  .ci-grid .city { max-width: 160px; }\n  .ci-grid .check-btn { justify-self: end; }\n  .ci-preview { cursor: pointer; width: 84px; height: 84px; border-radius: 14px; overflow: hidden; display: grid; place-items: center; color: var(--text);\n    border: 1.5px solid; border-color: var(--g-edge-sunk);\n    background: linear-gradient(180deg, var(--w-top) 0%, var(--w-bot) 100%);\n    box-shadow: inset 0 3px 6px var(--g-insh), inset 0 -1px 0 rgba(255,255,255,.3), 0 0 0 1px var(--g-hair); }\n  .ci-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }\n  .status-card { width: 100%; font-size: 17px; font-weight: 700; text-align: center; padding: 8px 0; color: var(--text); pointer-events: none; user-select: none; }\n\n  /* ===== Logo de vidrio tallado (forma irregular original): grande y bolitas ===== */\n  .glass-logo { --u: 1; }\n  .glass-logo i, .glass-logo .spin { position: absolute; inset: 0; display: block; pointer-events: none; }\n  .glass-logo i.gl-under, .glass-logo i.gl-under2, .glass-logo i.gl-rim { bottom: -10.625%; }\n  .gl-under  { -webkit-mask: url(\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAUAAAAFiCAYAAACH9AGXAAAbLklEQVR42u3deZDkZX3H8Xf3zC6LurDciAjIfQhyGDkVjQKiJh4lEkWDRkWNWlGqooWpRKMV4xGxosYrJAHUxCMmxHihUYKioAZUQG4RiQhyuctyLjPT+eP7POlnf/vrnp6jZ/p4v6q2emZ2Zna2p/vT3+9z/RqtVgtJGkdN7wJJBqAkGYCSZABKkgEoSQagJBmAkmQASpIBKEkGoCQZgJJkAEqSAShJBqAkGYCSZABKkgEoSQagJBmAkmQASpIBKEkGoCQZgJJkAEqSAShJBqAkGYCSZABKkgEoyQCUJANQkgxASTIAJckAlCQDUJIMQEkyACXJAJQkA1CSDEBJMgAlyQCUJANQkgxASTIAJckAlCQDUJIMQEkyACXJAJQkA1CSDEBJMgAlyQCUJANQkgxASTIAJckAlGQASpIBKEkGoCQZgJJkAEqSAShJBqAkGYCSZABKkgEoSQagJBmAkmQASpIBKEkGoCQZgJJkAEqSAShJBqAkGYCSZABKkgEoSQagJBmAkmQASpIBKEkGoCQZgJIMQO8CSQagJBmAkmQASpIBKEkGoCQZgJJkAEqSAShJBqAkGYCSZABKkgEoSQagJBmAkmQASpIBKEkGoCQZgJJkAEqSAShJBqAkGYCSZABKkgEoSQagJBmAkmQASpIBKMkAlCQDUJIMQEkyACXJAJQkA1CSDEBJMgAlyQCUJANQkgxASTIAJckAlCQDUJIMQEkyACXJAJQkA1CSDEBJMgAlyQCUJANQkgxASTIAJckAlCQDUJIMQEkyACXJAJRkAEqSAShJBqAkGYCSZABKkgEoSQagJBmAkjSEuWcASjIJJWlMtAxASVaA3gWSDEBJMgAlaaQ5BihJBqAkA1CSDEBJMgAlyQCUJANQkgxASTIAJckAlCQDUJKGJf8MQEnjppFudzEAJY2rlc2aVJSkcbC1AShpXFvgfcsAbHm/SBojDzoGKGlcbWsAShpX+9gCSxpXK6wAJY2bmXR7gAEoaRw1gVUGoKRxtAbY3ACUNE7yGsAtgHsMQEnjGIA7AWsMQEnjJGfeY4EJA1DSONoduMsAlDSO9gCuNQAljZPpdPsYXAYjacy0gElgH+BOA1DSuNkS2B64xgCUNC5y3u
